  d.className="jpwrap"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  d.innerHTML=`<div class="jpcard">
    <div class="lab">Muéstrale esto a quien preguntes</div>
    <div class="kanji">${esc(p.jp)}</div>
    <div class="romaji">${esc(p.n)}</div>
    <div class="addr">${esc(p.jd||"")}</div>
    <div class="tip">ここに行きたいです · Quiero ir aquí</div>
    <button class="jpclose">Cerrar</button></div>`;
  d.addEventListener("click",()=>d.remove());
  document.body.appendChild(d);
  d.querySelector(".jpclose").focus();
}
addEventListener("keydown",e=>{
  if(e.key==="Escape"){const w=document.querySelector(".jpwrap"); if(w)w.remove();}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-jp]");
  if(b){e.preventDefault();verJP(b.dataset.jp);}
});

// ---------------- conversor
function tc(){
  let v=D.TC;
  try{const s=localStorage.getItem("jp-tc"); if(s&&+s>0)v=+s;}catch(_){}
  return v;
}
function vYenes(){
  const r=tc();
  const montos=[100,300,500,800,1000,1500,3000,5000,10000];
  let h=`<p class="lede">Escribe en cualquiera de los dos campos y el otro se ajusta solo.
    El tipo de cambio lo puedes corregir abajo cuando sepas el real.</p>
    <div class="conv">
      <div class="cfield"><label for="inYen">Yenes</label>
        <input id="inYen" type="text" inputmode="decimal" value="1000" autocomplete="off"></div>
      <div class="cswap">=</div>
      <div class="cfield"><label for="inMxn">Pesos</label>
        <input id="inMxn" type="text" inputmode="decimal" value="" autocomplete="off"></div>
      <div class="rate"><span>Tipo de cambio:</span>
        <input id="inTc" type="text" inputmode="decimal" value="${r}">
        <span>yenes por peso</span>
        <button class="go" id="btTc" style="margin-left:auto">Restablecer</button></div>
    </div>
    <h2 class="sec">De un vistazo</h2><div class="quick" id="quick"></div>
    <h2 class="sec">Para calcular de cabeza</h2><div class="items">
    <div class="item"><div class="t">La regla rápida</div>
      <div class="x">Quita un cero y resta un poco. ¥1,000 son como $110. ¥3,500 son como $390.
        Te deja a menos del 10% del valor real, suficiente para decidir en una tienda.</div></div>
    <div class="item"><div class="t">Lo que cuestan las cosas</div>
      <div class="x">Un almuerzo de konbini ronda ¥600. Una comida sentado, ¥1,200. Un café, ¥500.
        Un trayecto corto de metro, ¥200. Un taxi arranca cerca de ¥500.</div></div>
    </div>`;
  return h;
}
function conv(){
  const y=document.getElementById("inYen"), m=document.getElementById("inMxn"),
        t=document.getElementById("inTc");
  if(!y)return;
  const num=s=>{const n=parseFloat(String(s).replace(/[^0-9.]/g,""));return isFinite(n)?n:0;};
  const fmt=n=>n>=1000?Math.round(n).toLocaleString("es-MX"):(Math.round(n*100)/100).toLocaleString("es-MX");
  const r=()=>Math.max(.01,num(t.value)||D.TC);
  const desdeYen=()=>{m.value=fmt(num(y.value)/r());};
  const desdeMxn=()=>{y.value=fmt(num(m.value)*r());};
  const quick=()=>{
    const q=document.getElementById("quick"); if(!q)return;
    q.innerHTML=[100,300,500,800,1000,1500,3000,5000,10000].map(v=>
      `<div class="q"><b>¥${v.toLocaleString("es-MX")}</b><span>$${fmt(v/r())}</span></div>`).join("");
  };
  y.addEventListener("input",()=>{desdeYen();});
  m.addEventListener("input",()=>{desdeMxn();});
  t.addEventListener("input",()=>{
    try{localStorage.setItem("jp-tc",String(r()));}catch(_){}
    desdeYen(); quick();
  });
  document.getElementById("btTc").addEventListener("click",()=>{
    t.value=D.TC; try{localStorage.removeItem("jp-tc");}catch(_){}
    desdeYen(); quick();
  });
  desdeYen(); quick();
}

// ---------------- ayuda
function hotelHoy(){
  const n=new Date();
  const jp=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(n);
  const d=D.D.find(x=>x.iso===jp);
  return D.HOTELDIA[String(d?d.n:diaSel)]||"hotel_tko";
}
function vAyuda(){
  const hk=hotelHoy(), ho=D.L[hk];
  let h=`<div class="sos"><div class="k">Si te perdiste</div>
    <div class="t">${esc(ho.n.split(" (")[0])}</div>
    <div class="acts">`;
  const u=ho.lat!=null?`https://www.google.com/maps/dir/?api=1&destination=${ho.lat}%2C${ho.lng}&travelmode=transit`:"";
  if(u)h+=`<a class="go" href="${u}" target="_blank" rel="noopener">${ICON_GO} Llévame al hotel</a>`;
  if(ho.jp)h+=`<button class="go" data-jp="${hk}">${ICON_JP} Mostrar en japonés</button>`;
  h+=`</div></div>
    <p class="lede">Nada de esto es grave si sabes qué hacer. Japón es de los países más seguros
      y más ordenados para resolver un problema: en cualquier estación hay alguien que ayuda.</p>
    <h2 class="sec">Números de emergencia</h2><div class="items">`;
  D.EM.forEach(e=>{
    h+=`<div class="item"><div class="t">${esc(e.t)}</div>
      <div class="tel"><a href="tel:${esc(e.n).replace(/[^+0-9]/g,"")}">${esc(e.n)}</a></div>
      <div class="x">${esc(e.x)}</div>`;
    if(e.k)h+=`<div class="x" style="font-size:17px;color:var(--fg);font-weight:500;margin-top:8px">${esc(e.k)}</div>`;
    h+=`</div>`;
  });
  h+=`</div><h2 class="sec">Si algo sale mal</h2>`;
  D.PR.forEach(pb=>{
    h+=`<details class="prob"><summary>${esc(pb.t)}</summary><div class="cuerpo"><ol>`;
    pb.li.forEach(l=>h+=`<li>${esc(l)}</li>`);
    h+=`</ol>`;
    if(pb.k)h+=`<div class="x" style="font-size:17px;color:var(--fg);font-weight:500;margin-top:11px;
      padding-top:11px;border-top:1px dashed var(--line)">${esc(pb.k)}</div>`;
    h+=`</div></details>`;
  });
  h+=`<h2 class="sec">Cómo funciona el tren</h2><div class="items">`;
  D.TR.forEach(t=>h+=`<div class="item"><div class="t">${esc(t.t)}</div><div class="x">${esc(t.x)}</div></div>`);
  h+=`</div><h2 class="sec">Los tres hoteles</h2><div class="items">`;
  ["hotel_tko","hotel_kyo","hotel_osa"].forEach(k=>{
    const p=D.L[k];
    h+=`<div class="item"><div class="t">${esc(p.n.split(" (")[0])}</div>
      <div class="x">${esc(p.d)}</div><div class="acts">`;
    if(p.lat!=null)h+=`<a class="go" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat}%2C${p.lng}&travelmode=transit" target="_blank" rel="noopener">${ICON_GO} Ruta</a>`;
    if(p.jp)h+=`<button class="go" data-jp="${k}">${ICON_JP} En japonés</button>`;
    h+=`</div></div>`;
  });
  h+=`</div>`;
  return h;
}

 hoy:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg>',

// los cinco lugares de la barra; "mas" abre la hoja
const TABS=[["ahora","Hoy",I.hoy],["dias","Días",I.dias],
            ["ayuda","Ayuda",I.ayuda,true],
            ["yenes","Yenes",I.yenes],["mas","Más",I.mas]];
const ENHOJA=[["saber","Saber","Cómo funciona todo",I.saber],
              ["guia","Guía","Frases, glosario y lugares",I.guia],
              ["reservas","Reservas","Qué falta comprar",I.reservas],
              ["vuelos","Vuelos","Horarios y equipaje",I.vuelos],
              ["seul","Seúl","Las 12 horas de escala",I.seul]];

let actual="ahora";
function ir(k,push){
  if(!VISTAS.some(v=>v[0]===k))k="ahora";
  actual=k; cerrarHoja();
  VISTAS.forEach(([id,,fn])=>{
    const el=document.getElementById("v-"+id);
    if(id===k){el.innerHTML=fn();el.hidden=false;}else{el.hidden=true;}
  });
  if(k==="dias")renderDia();
  if(k==="yenes")conv();
  const enHoja=ENHOJA.some(x=>x[0]===k);
  document.querySelectorAll("#tabbar .tab").forEach(b=>{
    const v=b.dataset.v;
    b.setAttribute("aria-current",String(v===k||(v==="mas"&&enHoja)));
  });
  if(push&&location.hash!=="#"+k)location.hash=k;
  window.scrollTo({top:0,behavior:"instant"});
}

document.querySelector("#tabbar .bar").innerHTML=TABS.map(([id,nom,ic,mid])=>
  `<button class="tab${mid?" mid":""}" data-v="${id}" aria-current="false">${ic}<span>${nom}</span></button>`).join("");
document.getElementById("sheetlist").innerHTML=ENHOJA.map(([id,nom,sub,ic])=>
  `<button data-v="${id}" role="menuitem">${ic}${nom}<em>${sub}</em></button>`).join("");

const hoja=document.getElementById("sheet");
function abrirHoja(){hoja.hidden=false;document.body.style.overflow="hidden";}
function cerrarHoja(){hoja.hidden=true;document.body.style.overflow="";}
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]"); if(!b)return;
  if(b.dataset.v==="mas"){hoja.hidden?abrirHoja():cerrarHoja();return;}
  ir(b.dataset.v,true);
});
hoja.addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]");
  if(b){ir(b.dataset.v,true);return;}
  if(!e.target.closest(".sheet"))cerrarHoja();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrarHoja();});

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-v2]"); if(b)ir(b.dataset.v2,true);
});
document.addEventListener("change",e=>{
  const c=e.target.closest("input[data-ck]");
  if(c){try{localStorage.setItem(c.dataset.ck,c.checked?"1":"0");}catch(_){}}
});
document.addEventListener("click",e=>{
  const b=e.target.closest(".dbtn");
  if(b){diaSel=+b.dataset.dia;renderDia();
    try{localStorage.setItem("jp-dia",String(diaSel));}catch(_){}}
});
window.addEventListener("hashchange",()=>ir(location.hash.slice(1),false));
try{const s=localStorage.getItem("jp-dia"); if(s)diaSel=Math.min(10,Math.max(1,+s));}catch(_){}
tick(); setInterval(tick,1000);
setInterval(()=>{if(actual==="ahora"||actual==="reservas")ir(actual,false);},60000);
ir(location.hash?location.hash.slice(1):"ahora",false);
</script>
