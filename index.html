ués, a dormir temprano: la primera noche el desfase pega fuerte.","dur":"2 h","lugar":"hoppy","desde":"hotel_tko"},{"d":2,"h":"08:00 – 09:00","ini":"08:00","fin":"09:00","t":"Desayuno y salida","x":"Konbini y a la estación, que está al lado del hotel.","dur":"1 h","lugar":null},{"d":2,"h":"09:00 – 09:45","ini":"09:00","fin":"09:45","t":"Tsukuba Express a Tsukuba","x":"Directo, sin transbordos, 45 minutos.","dur":"45 min","lugar":null},{"d":2,"h":"10:00 – 11:00","ini":"10:00","fin":"11:00","t":"AIST-Cube","x":"La sala de exhibición del AIST, el instituto público de investigación industrial de Japón. Antes se llamaba Science Square Tsukuba; lo renombraron y reabrió en abril de 2025 con exhibiciones nuevas. Cuatro zonas donde muestran robótica, materiales avanzados y tecnología que todavía no llega al mercado. Recorrido libre, sin guía. La hora depende de la que les asignen al reservar.","dur":"1 h","lugar":"aist","act":{"estado":"Gratis","reserva":"SÍ, obligatoria. La ventana abre el 11 de noviembre"},"desde":"hotel_tko"},{"d":2,"h":"11:00 – 11:30","ini":"11:00","fin":"11:30","t":"Traslado a JAXA","x":"Bus local entre los dos centros, directo desde AIST-Cube.","dur":"30 min","lugar":null},{"d":2,"h":"11:30 – 13:30","ini":"11:30","fin":"13:30","t":"JAXA — Space Dome","x":"La agencia espacial japonesa. En el Space Dome hay satélites reales, motores de cohete y una maqueta a tamaño real del módulo Kibo de la Estación Espacial. Afuera, en el Rocket Square, está un cohete H-II real de 50 metros: ese es el punto de la foto. Entrada libre y gratis, sin reserva. Hay audioguía en inglés desde el celular.","dur":"2 h","lugar":"jaxa","act":{"estado":"Gratis","reserva":"No, sin tour guiado. Pero verificar el calendario de días abiertos"},"desde":"aist"},{"d":2,"h":"13:30 – 14:30","ini":"13:30","fin":"14:30","t":"Comida","x":"Saliendo de JAXA. Hay konbini cerca y la tienda Planet Cube en el mismo recinto.","dur":"1 h","lugar":null},{"d":2,"h":"14:30 – 15:50","ini":"14:30","fin":"15:50","t":"Regreso a Tokio, directo a Shibuya","x":"Tsukuba Express hasta Akihabara, que es donde termina la línea, y de ahí 25 minutos a Shibuya. No pasan por el hotel.","dur":"1h20","lugar":null},{"d":2,"h":"16:00 – 17:30","ini":"16:00","fin":"17:30","t":"Shibuya SKY","x":"Mirador a 229 metros con plataforma exterior abierta, la mejor vista panorámica de la ciudad. Está conectado directo con la estación. El celular va en locker en la zona Sky Edge. Llevar abrigo: arriba hace bastante más frío por el viento. El atardecer del 11 de diciembre es alrededor de las 16:28, así que un slot de 16:30 cae justo en la hora dorada.","dur":"1.5 h","lugar":"shibuyasky","act":{"estado":"Por pagar","reserva":"SÍ. Alarmas el 12 y el 26 de noviembre a las 9:00 am (para el 11 de dic)"},"desde":"jaxa"},{"d":2,"h":"17:30 – 19:00","ini":"17:30","fin":"19:00","t":"Cruce de Shibuya y tiempo libre","x":"Sin nada programado. Están en Shibuya, al pie del cruce.","dur":"1.5 h","lugar":null},{"d":2,"h":"19:00 – 21:00","ini":"19:00","fin":"21:00","t":"Cena","x":"En Shibuya o de regreso en Asakusa.","dur":"2 h","lugar":null},{"d":3,"h":"08:00 – 08:30","ini":"08:00","fin":"08:30","t":"Enviar las maletas a Kioto (takkyubin)","x":"ANTES de salir del hotel. En recepción del Vessel Inn piden el servicio de Yamato y mandan las maletas grandes al Framboise Kyoto. Cuesta unos ¥2,400 por maleta. Preguntar a recepción su hora de corte y CONFIRMAR que llegan el domingo 13, no el lunes 14. En la mochila de mano se quedan: pasaporte, medicinas, cargadores, power banks, cámara y una muda para el domingo.","dur":"30 min","lugar":"hotel_tko","desde":"hotel_tko"},{"d":3,"h":"08:30 – 09:30","ini":"08:30","fin":"09:30","t":"Traslado a Harajuku","x":"Ginza Line y después Yamanote.","dur":"1 h","lugar":null},{"d":3,"h":"09:30 – 11:00","ini":"09:30","fin":"11:00","t":"Meiji Jingu","x":"Santuario sintoísta dedicado al emperador Meiji, dentro de un bosque de 100,000 árboles donados de todo Japón. Sorprende el silencio estando justo al lado del caos de Harajuku. En sábado es común ver bodas tradicionales. Antes de entrar se lavan manos y boca en el temizuya, la fuente de piedra de la entrada.","dur":"1.5 h","lugar":"meiji","act":{"estado":"Gratis","reserva":"No necesita"},"desde":"hotel_tko"},{"d":3,"h":"11:00 – 12:30","ini":"11:00","fin":"12:30","t":"Takeshita Street","x":"Calle peatonal de 400 metros, el corazón de la moda kawaii: ropa, accesorios, crepes gigantes y merchandising. Está justo enfrente de la salida Takeshita de la estación. Probar un crepe en Marion Crepes o Santa Monica. Caminando 5 minutos se llega a Omotesando, que es el contraste total con tiendas de lujo.","dur":"1.5 h","lugar":"takeshita","act":{"estado":"Por pagar","reserva":"No necesita"},"desde":"meiji"},{"d":3,"h":"12:30 – 13:30","ini":"12:30","fin":"13:30","t":"Comida","x":"Temprano, porque el tour arranca a las 16:00.","dur":"1 h","lugar":null},{"d":3,"h":"13:30 – 15:30","ini":"13:30","fin":"15:30","t":"Tiempo libre","x":"Sin nada programado, antes de que los recojan.","dur":"2 h","lugar":null},{"d":3,"h":"15:30 – 16:00","ini":"15:30","fin":"16:00","t":"Punto de encuentro del tour","x":"Estar en el punto acordado con tiempo. Llevar abrigo grueso, gorro y guantes: en Daikoku pega el viento de la bahía.","dur":"30 min","lugar":null},{"d":3,"h":"16:00 – 22:00","ini":"16:00","fin":"22:00","t":"Tour a Daikoku PA","x":"Área de servicio sobre la autopista Bayshore, en Yokohama. Cada sábado por la noche se juntan Skylines GT-R, Supras, RX-7, kei trucks tuneados y VIP cars. Cultura JDM en vivo. Van de pasajeros, el tour los recoge y los regresa. Llevar yenes en monedas para las vending machines y mucha ropa de abrigo: frío y viento de bahía.","dur":"6 h","lugar":"daikoku","act":{"estado":"PAGADO","reserva":"Ya reservado. Tour de pasajero. Recogida a las 16:00"},"desde":"takeshita"},{"d":4,"h":"09:00 – 10:00","ini":"09:00","fin":"10:00","t":"Desayuno y check-out","x":"El límite es a las 11:00, pero conviene salir antes: el museo Toyota cierra a las 17:00 y el día no tiene holgura. Las maletas grandes ya van camino a Kioto desde ayer, así que solo cargan la mochila de mano.","dur":"1 h","lugar":"hotel_tko","desde":"hotel_tko"},{"d":4,"h":"10:00 – 10:45","ini":"10:00","fin":"10:45","t":"A Tokyo Station","x":"Con equipaje de mano nada más. Si por lo que sea una maleta se quedó, los lockers grandes de Tokyo Station cuestan ~¥800 pero NO sirven aquí: ya no regresan a Tokio. En ese caso habría que usar los lockers de la estación de Nagoya.","dur":"45 min","lugar":null},{"d":4,"h":"11:00 – 12:40","ini":"11:00","fin":"12:40","t":"Shinkansen a Nagoya","x":"Tren Hikari, 1 hora 40 minutos.","dur":"1h40","lugar":null},{"d":4,"h":"13:00 – 13:45","ini":"13:00","fin":"13:45","t":"Comida en Nagoya","x":"Cerca de la estación o dentro del museo.","dur":"45 min","lugar":null},{"d":4,"h":"14:00 – 17:00","ini":"14:00","fin":"17:00","t":"Museo Toyota","x":"Está en el edificio donde Toyota nació como fábrica textil, antes de hacer autos. Dos pabellones: el textil, con telares automáticos funcionando de verdad, y el automotriz, con una línea de producción real y prensas trabajando. Mucho más interactivo que el otro museo de Toyota que está a las afueras. Pedir la audioguía gratis y revisar el horario de los shows de máquinas al entrar. Cierra a las 17:00.","dur":"3 h","lugar":"toyota","act":{"estado":"Por pagar","reserva":"No. Se paga en taquilla. Cierra lunes"},"desde":"hotel_tko"},{"d":4,"h":"17:00 – 17:30","ini":"17:00","fin":"17:30","t":"Regreso a Nagoya Station","x":"Meitetsu desde Sako, 3 minutos, más la caminata. El museo cierra a las 17:00 en punto: salir a esa hora o antes.","dur":"30 min","lugar":null},{"d":4,"h":"17:45 – 18:20","ini":"17:45","fin":"18:20","t":"Shinkansen a Kioto","x":"35 minutos.","dur":"35 min","lugar":null},{"d":4,"h":"18:45 – 19:45","ini":"18:45","fin":"19:45","t":"Check-in en Kioto y recoger maletas","x":"Al hacer el check-in, pedir las maletas que llegaron por takkyubin. Suelen quedarse en recepción, no las suben al cuarto. Verificar que llegaron las dos antes de instalarse.","dur":"1 h","lugar":"hotel_kyo","desde":"toyota"},{"d":4,"h":"19:45 – 21:00","ini":"19:45","fin":"21:00","t":"Cena ligera","x":"Cerca del hotel, sin complicarse.","dur":"1.5 h","lugar":null},{"d":5,"h":"07:00 – 07:45","ini":"07:00","fin":"07:45","t":"Salida temprano","x":"Konbini y JR Nara Line.","dur":"45 min","lugar":null},{"d":5,"h":"08:00 – 10:30","ini":"08:00","fin":"10:30","t":"Fushimi Inari Taisha","x":"El santuario más fotografiado de Japón: 10,000 toriis rojos formando túneles que suben la montaña Inari. Está dedicado a Inari, deidad del arroz, y los zorros son sus mensajeros. Subir al menos hasta Yotsutsuji, el mirador con vista de Kioto, que son unos 45 minutos de escaleras. Llegar antes de las 8 es la diferencia entre caminar solo y caminar entre multitudes.","dur":"2.5 h","lugar":"fushimi","act":{"estado":"Gratis","reserva":"No necesita. Ir antes de las 8 am"},"desde":"hotel_kyo"},{"d":5,"h":"10:30 – 11:30","ini":"10:30","fin":"11:30","t":"Kitsune udon","x":"En los puestos del camino de bajada. Es udon con tofu frito, el platillo asociado a los zorros del santuario.","dur":"1 h","lugar":null},{"d":5,"h":"12:00 – 15:00","ini":"12:00","fin":"15:00","t":"Tiempo libre","x":"Sin nada programado.","dur":"3 h","lugar":null},{"d":5,"h":"15:00 – 16:00","ini":"15:00","fin":"16:00","t":"Traslado a Gion","x":"Línea Keihan de Fushimi-Inari a Gion-Shijo, 12 minutos.","dur":"1 h","lugar":null},{"d":5,"h":"16:00 – 17:30","ini":"16:00","fin":"17:30","t":"Santuario Yasaka","x":"Santuario sintoísta del siglo VII, el corazón espiritual de Gion. Al anochecer encienden cientos de faroles y el ambiente cambia por completo. Al lado está el parque Maruyama.","dur":"1.5 h","lugar":"yasaka","act":{"estado":"Gratis","reserva":"No necesita. Ir al atardecer"},"desde":"fushimi"},{"d":5,"h":"17:30 – 19:00","ini":"17:30","fin":"19:00","t":"Hanamikoji y Shirakawa","x":"Las dos calles más bonitas de Gion, con casas de té de madera. Si ven una maiko o una geiko, nada de perseguirlas ni bloquearles el paso: hay multas por acoso turístico y van en serio.","dur":"1.5 h","lugar":null},{"d":5,"h":"19:00 – 21:00","ini":"19:00","fin":"21:00","t":"Cena en Pontocho","x":"Callejón angosto junto al río, lleno de restaurantes con farolitos. Una de las dos cenas especiales del viaje.","dur":"2 h","lugar":"pontocho","desde":"yasaka"},{"d":6,"h":"08:00 – 09:00","ini":"08:00","fin":"09:00","t":"Bus a Kinkaku-ji","x":"Bus 101 o 205 desde Kioto Station, unos 40 minutos.","dur":"1 h","lugar":null},{"d":6,"h":"09:00 – 10:00","ini":"09:00","fin":"10:00","t":"Kinkaku-ji","x":"El Pabellón Dorado: un templo zen cubierto en pan de oro que se refleja en un estanque. Probablemente la imagen más icónica de Kioto. El recorrido es de una sola dirección por un camino fijo. Con el frío de diciembre existe la posibilidad de verlo con algo de nieve en el techo. La entrada se paga EN EFECTIVO.","dur":"1 h","lugar":"kinkakuji","act":{"estado":"Por pagar","reserva":"No. Se paga EN EFECTIVO en la puerta"},"desde":"hotel_kyo"},{"d":6,"h":"10:00 – 11:30","ini":"10:00","fin":"11:30","t":"Tiempo libre","x":"Sin nada programado.","dur":"1.5 h","lugar":null},{"d":6,"h":"11:30 – 12:30","ini":"11:30","fin":"12:30","t":"Comida","x":"Por la zona o de regreso al centro.","dur":"1 h","lugar":null},{"d":6,"h":"13:00 – 19:00","ini":"13:00","fin":"19:00","t":"Tiempo libre","x":"Sin nada programado.","dur":"6 h","lugar":null},{"d":6,"h":"19:00 – 21:00","ini":"19:00","fin":"21:00","t":"Cena","x":"En el centro de Kioto.","dur":"2 h","lugar":null},{"d":7,"h":"09:00 – 10:15","ini":"09:00","fin":"10:15","t":"Mañana tranquila en Kioto","x":"Última vuelta por el barrio antes de dejar la ciudad.","dur":"1h15","lugar":null},{"d":7,"h":"10:15 – 11:00","ini":"10:15","fin":"11:00","t":"Check-out","x":"LÍMITE 11:00 en punto. Salida del hotel de Kioto con las maletas.","dur":"45 min","lugar":"hotel_kyo","desde":"hotel_kyo"},{"d":7,"h":"11:15 – 12:15","ini":"11:15","fin":"12:15","t":"Tren a Osaka","x":"Al Kioto Station y de ahí JR rápido, 30 minutos.","dur":"1 h","lugar":null},{"d":7,"h":"12:30 – 13:00","ini":"12:30","fin":"13:00","t":"Dejar maletas en el hotel","x":"OJO: el check-in es hasta las 15:00, no antes. Llegan, dejan maletas y salen. El hotel está en Shikitsunishi, a 5 minutos a pie de Daikokucho, que es una estación al sur de Namba.","dur":"30 min","lugar":"hotel_osa","desde":"hotel_kyo"},{"d":7,"h":"13:00 – 14:30","ini":"13:00","fin":"14:30","t":"Comida y traslado al museo","x":"Yotsubashi Line directa de Daikokucho a Higobashi, sin transbordo.","dur":"1 h","lugar":null},{"d":7,"h":"14:30 – 17:00","ini":"14:30","fin":"17:00","t":"Osaka Science Museum","x":"Museo con tema de universo y energía: cuatro plantas y unas 200 exhibiciones interactivas de electromagnetismo, mecánica, química y astrofísica. Hay demostraciones en vivo varias veces al día. El edificio es donde Hideki Yukawa desarrolló la teoría de los mesones, que le dio el Nobel en 1949. El planetario, de 26.5 metros, es de los más grandes de Japón: reservar la función al llegar. La entrada son ¥400 y el planetario ¥600 aparte.","dur":"2.5 h","lugar":"osm","act":{"estado":"Por pagar","reserva":"No. ¥400 exhibición + ¥600 planetario. CIERRA LUNES Y MARTES"},"desde":"hotel_osa"},{"d":7,"h":"17:30 – 19:00","ini":"17:30","fin":"19:00","t":"Check-in y descanso","x":"Volver al hotel, hacer el check-in y recargar pilas.","dur":"1.5 h","lugar":"hotel_osa","desde":"osm"},{"d":7,"h":"19:00 – 22:00","ini":"19:00","fin":"22:00","t":"Dotonbori y cena","x":"La calle peatonal sobre el canal, centro nocturno de Osaka. Desde el hotel es una estación de metro o unos 20 minutos caminando. Letreros gigantes: el Glico Running Man, el cangrejo de Kani Doraku y el pez globo de Zuboraya. La foto con el Glico se toma desde el puente Ebisubashi. Imprescindibles: takoyaki en Wanaka, okonomiyaki en Mizuno y kushikatsu en Daruma, donde la regla sagrada es no mojar dos veces en la salsa. La calle paralela Hozenji Yokocho es mucho más tradicional y tranquila.","dur":"3 h","lugar":"dotonbori","act":{"estado":"Gratis","reserva":"No necesita. La cena va en el presupuesto de comidas"},"desde":"hotel_osa"},{"d":8,"h":"07:30 – 08:30","ini":"07:30","fin":"08:30","t":"Desayuno y traslado","x":"JR Yumesaki Line hasta Universal-City.","dur":"1 h","lugar":null},{"d":8,"h":"08:30 – 09:00","ini":"08:30","fin":"09:00","t":"Llegada antes de abrir","x":"Estar en la puerta 30 o 45 minutos antes de la apertura.","dur":"30 min","lugar":null},{"d":8,"h":"09:00 – 21:00","ini":"09:00","fin":"21:00","t":"Universal Studios Japan","x":"Lo PRIMERO al cruzar la entrada: abrir la app de USJ y activar el Area Timed Entry de Super Nintendo World, porque se acaba en una o dos horas. Después, con el Express Pass ya comprado, el resto del día se acomoda solo. Las zonas fuertes son Super Nintendo World con Mario Kart en realidad aumentada, el Wizarding World de Harry Potter con Hogwarts a tamaño real, Jurassic Park y Minions. En diciembre todo está decorado con luces y el árbol gigante navideño.","dur":"12 h","lugar":"usj","act":{"estado":"PAGADO","reserva":"Ya reservado, pase + Express"},"desde":"hotel_osa"},{"d":8,"h":"21:30 – 22:00","ini":"21:30","fin":"22:00","t":"Regreso al hotel","x":"De vuelta a Namba.","dur":"30 min","lugar":null},{"d":9,"h":"06:45 – 07:45","ini":"06:45","fin":"07:45","t":"Salida temprano hacia Minoo","x":"Midosuji de Daikokucho a Umeda y de ahí la línea Hankyu hasta Minoo. Desayuno de konbini en el camino. Madrugar es lo que hace que todo el día funcione.","dur":"1 h","lugar":"minoo","desde":"hotel_osa"},{"d":9,"h":"07:45 – 08:00","ini":"07:45","fin":"08:00","t":"Taxi hasta el templo","x":"Quince minutos subiendo el cerro desde la estación. Cuesta unos miles de yenes, pero los libera del bus Hankyu #29, que pasa una sola vez por hora y les amarraría el día entero.","dur":"15 min","lugar":null},{"d":9,"h":"08:00 – 10:00","ini":"08:00","fin":"10:00","t":"Templo Katsuo-ji","x":"Llegan justo a la hora de apertura, con la montaña prácticamente vacía y la mejor luz del día. Templo budista del siglo VIII conocido como el templo de las victorias: aquí viene la gente a pedir por exámenes, competencias y negocios. Está cubierto de miles de muñecas daruma rojas escondidas entre las rocas, en los escalones, bajo los árboles y sobre los faroles — cada una es un deseo que ya se cumplió. Comprar un daruma chico cuesta entre ¥500 y ¥1,500 y es el mejor souvenir del viaje.","dur":"2 h","lugar":"katsuoji","act":{"estado":"Por pagar","reserva":"No. Entrada ~¥500 + daruma de souvenir"},"desde":"minoo"},{"d":9,"h":"10:00 – 11:30","ini":"10:00","fin":"11:30","t":"Regreso hacia el centro","x":"Taxi de vuelta a Minoo y tren directo al castillo, sin pasar por el hotel.","dur":"1h30","lugar":null},{"d":9,"h":"11:30 – 13:00","ini":"11:30","fin":"13:00","t":"Castillo de Osaka","x":"El símbolo de la ciudad, con su foso de piedra y el parque alrededor. Ojo con la expectativa: la torre que ven es una reconstrucción de concreto de 1931, con elevador adentro y un museo de historia en los pisos. Lo mejor es el exterior, el foso y los muros originales, que son gratis. Si solo quieren la foto y caminar el parque, no hace falta pagar la torre.","dur":"1h30","lugar":"osakajo","act":{"estado":"Por pagar","reserva":"No. Se puede comprar en línea y saltarse la fila. El parque y el foso son gratis"},"desde":"katsuoji"},{"d":9,"h":"13:00 – 14:00","ini":"13:00","fin":"14:00","t":"Comida","x":"Por la zona del castillo o camino a Taisho.","dur":"1 h","lugar":null},{"d":9,"h":"14:30 – 16:30","ini":"14:30","fin":"16:30","t":"Mr. Hiro Car Studio — Café","x":"Centro de cultura JDM en Taisho-ku. Tienen AE86, RX-7 FC y FD, Skyline GT-R R32, Supra MK4, NSX y Silvia S15. Van solo al café: se entra, se ven los autos y se pueden tomar sus propias fotos sin pagar sesión. Si al llegar les antoja el simulador o el drift kart eléctrico, eso se contrata ahí mismo. Si les gusta Initial D, pregunten por las réplicas del anime. Abren todos los días de 9:00 a 19:00.","dur":"2 h","lugar":"mrhiro","act":{"estado":"Por pagar","reserva":"No necesita. Solo el café, sin renta ni sesión de fotos"},"desde":"osakajo"},{"d":9,"h":"16:30 – 17:15","ini":"16:30","fin":"17:15","t":"Regreso a Namba","x":"JR Loop Line desde Taisho.","dur":"45 min","lugar":null},{"d":9,"h":"17:15 – 19:00","ini":"17:15","fin":"19:00","t":"Den Den Town","x":"El Akihabara de Osaka: electrónica, anime, figuras y componentes. Se movió aquí porque el sábado ya no hay mañana libre. Las tiendas cierran a las 19:00, así que no se entretengan en el camino. Para el tax-free hay que llevar el pasaporte físico y gastar mínimo ¥5,000 en la misma tienda el mismo día.","dur":"1h45","lugar":"dendentown","act":{"estado":"Gratis","reserva":"No necesita. Llevar pasaporte para el tax-free"},"desde":"mrhiro"},{"d":9,"h":"19:00 – 21:00","ini":"19:00","fin":"21:00","t":"Cena","x":"Por Namba o Dotonbori, que quedan al lado.","dur":"2 h","lugar":null},{"d":10,"h":"09:00 – 10:00","ini":"09:00","fin":"10:00","t":"Desayuno","x":"Sin prisa: hoy no salen hasta el mediodía.","dur":"1 h","lugar":null},{"d":10,"h":"10:00 – 11:00","ini":"10:00","fin":"11:00","t":"Check-out y maletas","x":"El check-out es a las 10:00 en punto. El hotel puede guardarles las maletas un rato si quieren salir ligeros.","dur":"1 h","lugar":"hotel_osa","desde":"hotel_osa"},{"d":10,"h":"11:00 – 12:30","ini":"11:00","fin":"12:30","t":"Tiempo libre en Osaka","x":"Hora y media de margen antes de arrancar. Si quedó algo pendiente en Den Den Town, abre a las 11:00 y está a 15 minutos a pie.","dur":"1h30","lugar":null},{"d":10,"h":"12:30 – 13:10","ini":"12:30","fin":"13:10","t":"Metro a Shin-Osaka","x":"Línea Midosuji directa desde Daikokucho, sin transbordos. Llegar con margen para recoger o comprar los boletos.","dur":"40 min","lugar":null},{"d":10,"h":"13:30 – 16:00","ini":"13:30","fin":"16:00","t":"Shinkansen Nozomi a Tokio","x":"Dos horas y media. RESERVAR CON ANTICIPACIÓN: es sábado de diciembre y van con maletas. Si alguna maleta pasa de 160 cm sumando alto, ancho y largo, hay que pedir asiento con espacio para equipaje grande — gratis al reservar, ¥1,000 de multa si no se avisa.","dur":"2h30","lugar":null},{"d":10,"h":"16:00 – 16:30","ini":"16:00","fin":"16:30","t":"Transbordo en Tokyo Station","x":"Del andén del shinkansen al del Narita Express. La estación es enorme: seguir los letreros de N'EX desde que bajan.","dur":"30 min","lugar":null},{"d":10,"h":"16:30 – 17:30","ini":"16:30","fin":"17:30","t":"Narita Express al aeropuerto","x":"Una hora directa hasta Narita Terminal 1.","dur":"1 h","lugar":"narita","desde":"hotel_osa"},{"d":10,"h":"17:30 – 20:40","ini":"17:30","fin":"20:40","t":"Aeropuerto de Narita T1","x":"Tres horas antes del vuelo. Documentar, reembolso tax-free si aplica y los últimos KitKats raros.","dur":"3h10","lugar":"narita","desde":"narita"},{"d":10,"h":"20:40","ini":"20:40","fin":"","t":"Despegue","x":"KE 0714 a Seúl y después AM 0091 a México. Llegada a CDMX el domingo 20 a las 10:35.","dur":"—","lugar":null}],"R":[{"p":"LISTO","q":"Universal Studios Japan + Express Pass ×2","dd":"usj.co.jp","c":"Ya reservado","e":"LISTO","link":""},{"p":"LISTO","q":"Tour Daikoku PA ×2 (de pasajero)","dd":"Klook / GetYourGuide","c":"Ya reservado","e":"LISTO","link":""},{"p":"LISTO","q":"Check-in del hotel de Tokio corregido al 10 dic","dd":"Confirmación del hotel","c":"Ya corregido","e":"LISTO","link":""},{"p":"LISTO","q":"Seguro de viaje ×2","dd":"—","c":"Ya contratado","e":"LISTO","link":""},{"p":"EN ESPERA","q":"Pokémon Café ×2","dd":"Klook","c":"Pagado. Confirman o no 48 h antes, o sea el 8 dic","e":"EN ESPERA","link":""},{"p":"URGENTE","q":"AIST-Cube ×2","dd":"forms.office.com/r/QdazR3NTBk","c":"La ventana abre el MIÉ 11 DE NOVIEMBRE","e":"PENDIENTE","link":"https://forms.office.com/r/QdazR3NTBk"},{"p":"URGENTE","q":"Shibuya SKY ×2, slot 16:30 del VIE 11 DIC","dd":"shibuya-scramble-square.com/sky/ticket","c":"Alarmas: JUE 12 y JUE 26 DE NOV, 9:00 am","e":"PENDIENTE","link":""},{"p":"LISTO","q":"2 eSIM Holafly regional Asia","dd":"holafly.com","c":"Ya compradas","e":"LISTO","link":""},{"p":"PENDIENTE","q":"Preguntar en el hotel de Tokio por el takkyubin","dd":"Recepción del Vessel Inn Asakusa","c":"Al hacer check-in el 10 dic: confirmar hora de corte y que entregan en Kioto el 13","e":"PENDIENTE","link":""},{"p":"VERIFICAR","q":"Calendario de días abiertos de JAXA","dd":"Calendario de Google de JAXA","c":"Revisar que el 11 dic no sea día de mantenimiento","e":"PENDIENTE","link":"https://calendar.google.com/calendar/u/0/embed?src=10ktsv0plsltccu5rasjl6rt5o%40group.calendar.google.com&ctz=Asia%2FTokyo"},{"p":"LISTO","q":"Dirección del hotel de Osaka","dd":"1-9-13 Shikitsunishi, Naniwa-ku. Tel +81 70-2474-0704","c":"Ya confirmada","e":"LISTO","link":""},{"p":"NO APLICA","q":"Permiso Internacional de Conducir","dd":"SCT México","c":"NO se necesita: en Daikoku van de pasajeros y en Mr. Hiro solo al café","e":"NO APLICA","link":""}],"G":[{"t":"Shinkansen","x":"El tren bala. Puntual al segundo. Los boletos se compran en la estación o en smart-ex.jp; no hace falta con meses de anticipación."},{"t":"IC card","x":"Tarjeta recargable de transporte: Suica y Pasmo en Tokio, ICOCA en Osaka, pero las tres funcionan en todo el país. Sirve también para pagar en konbinis y máquinas expendedoras."},{"t":"Konbini","x":"Tienda de conveniencia abierta 24/7: 7-Eleven, Lawson, FamilyMart. Comida de verdad buena y barata, cajeros que aceptan tarjetas mexicanas, baños limpios y Wi-Fi gratis."},{"t":"Izakaya","x":"Bar-restaurante japonés de platillos pequeños para compartir. El equivalente a una cantina con botana."},{"t":"Torii","x":"La puerta de madera o piedra que marca la entrada a un santuario sintoísta. En Fushimi Inari hay diez mil formando túneles."},{"t":"Temizuya","x":"Fuente de piedra en la entrada de los santuarios. Antes de entrar se enjuagan manos y boca con el cucharón."},{"t":"Daruma","x":"Muñeca roja redonda de la suerte. Se compra con los dos ojos en blanco, se pinta uno al pedir un deseo y el otro cuando se cumple."},{"t":"Maiko y geiko","x":"Aprendiz y maestra del arte tradicional de entretenimiento en Kioto. Geisha es el término de Tokio; en Kioto se dice geiko."},{"t":"JDM","x":"Japanese Domestic Market. Los autos fabricados para venderse solo en Japón: Skyline GT-R, RX-7, AE86, Supra."},{"t":"PA","x":"Parking Area. Área de servicio en la autopista. Daikoku PA es la más famosa del mundo por las reuniones de autos."},{"t":"Tax-free","x":"Devolución del impuesto para turistas. Se necesita el pasaporte físico y normalmente gastar mínimo ¥5,000 en la misma tienda el mismo día."},{"t":"Takoyaki","x":"Bolitas de masa rellenas de pulpo, especialidad de Osaka. Salen hirviendo por dentro: esperar."},{"t":"Okonomiyaki","x":"Algo entre tortita y pizza, de col y masa, con la salsa dulce encima. También muy de Osaka."},{"t":"Kushikatsu","x":"Brochetas empanizadas y fritas. Regla absoluta: la salsa comunitaria se moja UNA sola vez por brocheta."},{"t":"Kitsune udon","x":"Sopa de fideos udon con tofu frito. Kitsune significa zorro, el animal mensajero de Inari."},{"t":"Ningyo-yaki","x":"Pastelito relleno de pasta de frijol dulce, típico de la calle Nakamise en Asakusa."},{"t":"Nakamise","x":"La calle de puestos tradicionales que lleva de la puerta Kaminarimon al templo Senso-ji."},{"t":"Takuhaibin","x":"Servicio de mensajería de equipaje, normalmente de Yamato. Mandan la maleta de hotel a hotel por unos ¥2,000 para no cargarla en el shinkansen."}],"N":[{"t":"Tus vuelos y cuándo abre el check-in","x":"IDA: AM 0058, martes 8 de diciembre 21:45 desde CDMX T2, llega a Tokio-Narita T1 el jueves 10 a las 06:30 (16h29m). VUELTA: sábado 19 a las 20:40 desde Narita T1, con KE 0714 (Korean Air) a Seúl y AM 0091 a CDMX; llega el domingo 20 a las 10:35. El check-in abre 24 horas antes: lunes 7 de diciembre a las 21:45 para la ida, y viernes 18 a las 20:40 para la vuelta. Poner alarma a esas horas exactas: es cuando se liberan los asientos que estaban bloqueados."},{"t":"Clima en diciembre","x":"Frío seco. De 4 a 12 °C de día y de 0 a 5 °C de noche en las tres ciudades. Casi no llueve. Van con capas, abrigo, guantes y bufanda. En Shibuya SKY y en Daikoku PA hace bastante más frío por el viento."},{"t":"Efectivo","x":"Japón todavía usa muchísimo el efectivo. Los cajeros de 7-Eleven y Japan Post sí aceptan tarjetas mexicanas. Traer siempre entre ¥20,000 y ¥30,000 encima. Kinkaku-ji y el tour guiado de JAXA son solo efectivo."},{"t":"Enchufes","x":"Japón usa el mismo enchufe plano de dos patas que México, así que no hace falta adaptador. La diferencia es el voltaje: allá son 100V y aquí 127V. Revisar que los cargadores digan 100–240V en la letra chiquita."},{"t":"Equipaje entre ciudades","x":"Tokio→Kioto va por takkyubin de Yamato: se entrega en recepción el sábado 12 y llega al hotel de Kioto el domingo 13, unos ¥2,400 por maleta. Es lo que permite bajarse en Nagoya sin cargar nada. Tokio-Kioto es entrega AL DÍA SIGUIENTE, no el mismo día, así que hay que confirmar la fecha con recepción. Nunca mandar pasaporte, medicinas, cámara, laptop, efectivo ni power banks: esos van en la mochila de mano. Kioto→Osaka es traslado directo, ahí las maletas viajan con ustedes."},{"t":"Si falla el takkyubin","x":"Plan B para el domingo 13: lockers en la estación de Nagoya. Los grandes cuestan ¥800 y los bancos más surtidos están en la salida Sakura-dori (~360), Hirokoji (~450) y la terminal de autobuses (~280). Ojo: se llenan desde las 11 de la mañana y los grandes son los primeros en irse. Alternativa con lugar garantizado: reservar ecbo cloak en línea, ~¥800 por maleta."},{"t":"Idioma","x":"Google Translate con cámara resuelve los menús. Tres frases que sirven todo el viaje: arigatou gozaimasu (gracias), sumimasen (perdón o disculpe) y kore kudasai (esto, por favor)."},{"t":"Modales","x":"No comer caminando, no hablar fuerte en el tren, no sonarse la nariz en público y quitarse los zapatos cuando se indique. En Gion hay multas por acosar a maikos y geikos."},{"t":"Propinas","x":"No se dan. Dejar propina en Japón es de mala educación, no un detalle."},{"t":"Apps","x":"Google Maps, la IC card en Apple Wallet, Google Translate descargado para usar sin internet, la app de USJ y NAVITIME for Japan Travel."},{"t":"Dónde está el hotel de Osaka","x":"No está en Namba a pesar del nombre: está en Shikitsunishi, Naniwa-ku, a 5 minutos a pie de la estación Daikokucho. Es una estación al sur de Namba por la línea Midosuji. A Dotonbori son 20 minutos caminando o una estación de metro. Ventaja: Daikokucho tiene Midosuji Y Yotsubashi, así que el museo de ciencia y Katsuo-ji quedan en línea directa. Check-in 15:00, check-out 10:00."},{"t":"Horarios de los hoteles","x":"Tokio: check-out 11:00. Kioto: check-out 11:00. Osaka: check-in 15:00 y check-out 10:00. El de Osaka es el más estricto y el único con check-in tardío: el miércoles 16 hay que dejar maletas y volver después de las 15:00."},{"t":"Por qué taxi y no el bus a Katsuo-ji","x":"El bus Hankyu #29 desde Senri-Chuo cuesta ¥800 por persona cada trayecto, pero pasa solo una vez por hora y los horarios de diciembre de 2026 todavía no están publicados. El taxi desde la estación de Minoo son 15 minutos y unos ¥3,000 por viaje entre los dos: sale más caro, pero permite llegar a las 8:00 en punto, cuando el templo abre y está vacío, y deja libre toda la tarde. Si prefieren el bus, revisen el horario de regreso APENAS lleguen al templo."},{"t":"El regreso sale de Narita, no de Osaka","x":"El vuelo de vuelta despega de Narita (Tokio) a las 20:40, así que el sábado 19 hay que cruzar medio Japón de regreso. Shinkansen Shin-Osaka a Tokio (2h30) y después el Narita Express (1 h). Son unos ¥18,000 por persona que conviene reservar con semanas de anticipación: es sábado y en temporada alta. Por eso las compras de Den Den Town se movieron al viernes 18 por la tarde."},{"t":"Días de cierre a cuidar","x":"Museo Toyota cierra lunes, por eso va en domingo. Osaka Science Museum cierra lunes Y martes, por eso va en miércoles. AIST-Cube cierra lunes. JAXA cierra en días irregulares: hay que revisar su calendario."}],"F":[{"j":"Arigatō gozaimasu","p":"a-ri-GA-to go-zai-MASS","e":"Gracias (formal)","k":"ありがとうございます"},{"j":"Sumimasen","p":"su-mi-MA-sen","e":"Perdón, disculpe, con permiso","k":"すみません"},{"j":"Kore kudasai","p":"KO-re ku-da-SAI","e":"Esto, por favor","k":"これください"},{"j":"Onegaishimasu","p":"o-ne-GAI-shi-mass","e":"Por favor, se lo encargo","k":"お願いします"},{"j":"Eigo ga hanasemasu ka","p":"EI-go ga ha-na-se-MASS ka","e":"¿Habla inglés?","k":"英語が話せますか"},{"j":"Eigo no menyū arimasu ka","p":"EI-go no ME-nyu a-ri-MASS ka","e":"¿Tienen menú en inglés?","k":"英語のメニューはありますか"},{"j":"Toire wa doko desu ka","p":"TOI-re wa DO-ko dess ka","e":"¿Dónde está el baño?","k":"トイレはどこですか"},{"j":"Ikura desu ka","p":"i-KU-ra dess ka","e":"¿Cuánto cuesta?","k":"いくらですか"},{"j":"Daijōbu desu","p":"dai-JO-bu dess","e":"Está bien, no gracias","k":"大丈夫です"},{"j":"Wakarimasen","p":"wa-ka-ri-MA-sen","e":"No entiendo","k":"わかりません"},{"j":"Tasukete kudasai","p":"tas-KE-te ku-da-SAI","e":"Ayúdeme, por favor","k":"助けてください"},{"j":"Gochisōsama deshita","p":"go-chi-SO-sa-ma desh-ta","e":"Gracias por la comida, al salir","k":"ごちそうさまでした"}],"EM":[{"t":"Policía","n":"110","x":"Gratis desde cualquier teléfono, incluso sin saldo. Contestan en japonés; di despacio «English please» o muestra la tarjeta de abajo.","k":"警察を呼んでください"},{"t":"Ambulancia y bomberos","n":"119","x":"El mismo número para los dos. La ambulancia en Japón es gratuita.","k":"救急車を呼んでください"},{"t":"Emergencia consular mexicana","n":"080-9980-8022","x":"Línea de la Embajada de México, 24 horas los 365 días. Solo para urgencias reales: hospitalización, fallecimiento, detención. Desde México marca +81 80 9980 8022.","k":""},{"t":"Sección Consular de México","n":"+81 3-3580-2961","x":"Para pasaporte extraviado y trámites. Recepción de documentos de 9:00 a 12:00.","k":""},{"t":"Embajada de México","n":"+81 3-3581-1131","x":"2-15-1 Nagata-cho, Chiyoda-ku, Tokio 100-0014. La Sección Consular está en el 2-15-2.","k":"東京都千代田区永田町2-15-1 メキシコ大使館"},{"t":"Seguro de viaje","n":"— anótalo aquí —","x":"Pon el número de póliza y el teléfono de asistencia de tu seguro antes de salir. Es el dato que más rápido vas a necesitar y el único que no tengo.","k":""}],"PR":[{"t":"Me perdí","li":["Abre el botón de arriba: te traza la ruta a pie o en tren hasta el hotel de hoy.","Si no hay señal, entra a cualquier konbini: tienen Wi-Fi gratis.","Muestra la tarjeta en japonés del hotel a quien preguntes. La dirección sirve más que el nombre."],"k":"道に迷いました。助けてください。"},{"t":"Me pasé de estación","li":["Bájate en la siguiente parada, cruza al andén del sentido contrario y regrésate.","Con la IC card no pagas de más por eso: el cobro es por el trayecto real entre entrada y salida.","Si te pasaste en el shinkansen con asiento reservado, habla con el revisor."],"k":"乗り過ごしました。"},{"t":"La IC card no tiene saldo para salir","li":["No te quedas atrapado. Antes del torniquete hay una máquina de ajuste de tarifa: 精算機.","Mete la tarjeta, paga la diferencia en efectivo y sal normal.","Si no la encuentras, toca el botón del torniquete y el empleado de la caseta te ayuda."],"k":"チャージをお願いします。"},{"t":"Perdí el último tren","li":["En Japón el servicio para cerca de medianoche y arranca a las 5. No hay metro nocturno.","Opciones: taxi (caro, pero seguro), un karaoke o un café 24 horas, o un hotel cápsula.","Revisa la hora del último tren ANTES de la cena si vas lejos del hotel."],"k":"終電は何時ですか。"},{"t":"Se me acabó la batería","li":["Los konbini venden baterías de emergencia y cables a toda hora.","Hay estaciones de renta de baterías ChargeSPOT en muchos konbini y estaciones.","Sin teléfono: la tarjeta en japonés del hotel impresa es tu respaldo. Vale la pena llevarla en papel."],"k":"充電器はありますか。"},{"t":"Mi tarjeta no pasa","li":["Japón todavía usa mucho efectivo. Varios lugares chicos no aceptan tarjeta extranjera.","Saca yenes en los cajeros de 7-Eleven o de Japan Post: esos sí aceptan tarjetas mexicanas.","Trae siempre ¥20,000 a ¥30,000 encima por si acaso."],"k":"カードは使えますか。"},{"t":"Nos separamos","li":["Acuerden desde el primer día un punto de encuentro en cada zona. En Shibuya, la estatua de Hachiko.","Todos los konbini tienen Wi-Fi gratis para mandar mensaje sin datos.","Si no se encuentran, el punto de reunión por defecto es el hotel de esa noche."],"k":""},{"t":"Olvidé algo en el tren o en un restaurante","li":["En Japón casi siempre aparece. Regresa y pregunta: hay oficina de objetos perdidos en cada estación.","Di el nombre del objeto y enseña tu boleto o la hora aproximada.","En estaciones grandes hay mostrador de 忘れ物 (objetos olvidados)."],"k":"忘れ物をしました。"},{"t":"Perdí el pasaporte","li":["Primero ve a la policía (o a un koban, la caseta de policía de barrio) y pide el reporte.","Después llama a la Sección Consular de México: +81 3-3580-2961.","Con el reporte te emiten un documento para viajar. Lleva copia o foto del pasaporte desde ahora."],"k":"パスポートをなくしました。"},{"t":"Me siento mal","li":["Para algo grave, 119. La ambulancia es gratuita.","Para algo leve, las farmacias (薬局) tienen de todo y el personal suele entender inglés básico.","El hotel puede llamar a un médico que hable inglés; pídelo en recepción."],"k":"具合が悪いです。病院に行きたいです。"}],"TR":[{"t":"La IC card se toca dos veces","x":"Una al entrar y otra al salir. El cobro sale del trayecto real. Si solo tocas al entrar, el torniquete de salida no te abre. Se recarga en cualquier máquina de la estación o en el konbini."},{"t":"Busca el color y el número de la línea","x":"Cada línea tiene color y letra: Midosuji es roja y M, Ginza es naranja y G, Yamanote verde. Las estaciones traen número, como M20. Si sabes el color y el número, no necesitas leer japonés."},{"t":"Local, rápido o expreso","x":"No todos los trenes paran en todas las estaciones. En el tablero del andén viene el tipo: Local (各駅) para en todas, Rapid y Express se saltan varias. Si tu estación es chica, toma el Local."},{"t":"El andén correcto","x":"Los letreros dicen el destino final, no el tuyo. Busca en el mapa cuál es el final de tu dirección y síguelo. Si dudas, enseña la tarjeta en japonés al empleado de la caseta: siempre ayudan."},{"t":"El shinkansen es otra cosa","x":"Tiene torniquete aparte y boleto propio, no IC card. Mete los dos papeles juntos en la ranura y recógelos del otro lado. El número de vagón y asiento vienen impresos; el andén marca dónde se para cada vagón."},{"t":"Reglas no escritas","x":"No se habla por teléfono dentro del tren. No se come. Las mochilas van al frente o en la rejilla. En hora pico hay vagones solo para mujeres, marcados en rosa en el piso del andén."},{"t":"Si algo falla","x":"Toda estación tiene una caseta con personal junto a los torniquetes. Son pacientes y resuelven todo: saldo, tarjeta trabada, dirección equivocada. Es el recurso más confiable que vas a tener."}],"HOTELDIA":{"1":"hotel_tko","2":"hotel_tko","3":"hotel_tko","4":"hotel_tko","5":"hotel_kyo","6":"hotel_kyo","7":"hotel_kyo","8":"hotel_osa","9":"hotel_osa","10":"hotel_osa"},"EQ":[{"t":"CDMX → Narita","s":"AM 0058 · Aeroméxico","x":"Las tres piezas: accesorio personal, maleta de mano y una documentada de 25 kg. Confirmado por el asesor de Aeroméxico. Aun así, revisen la línea de franquicia del e-ticket, porque la tarifa es Básica y ahí es donde recortan."},{"t":"Narita → Incheon","s":"KE 0714 · Korean Air","x":"El tramo con la restricción. Korean Air publica que la maleta de mano es gratis en todas sus tarifas, pero el límite de economy es 10 kg COMBINADOS entre la de mano y el accesorio personal. Verificarlo directo con Korean Air usando el localizador CQLDC6."},{"t":"Incheon → CDMX","s":"AM 0091 · Aeroméxico","x":"Las tres piezas otra vez, igual que la ida."},{"t":"Lo que no se puede olvidar","s":"Durante las 12 h en Seúl","x":"Lo que documenten en Narita no lo vuelven a ver hasta México. Muda, aseo, cargadores y medicinas tienen que ir en las piezas de cabina, dentro de esos 10 kg."},{"t":"Para las compras","s":"Akihabara y Den Den Town","x":"Lo denso y resistente va en la documentada, que aguanta 25 kg. Lo frágil, en cabina. Si se pasan, mandar las compras por Japan Post desde Japón suele salir más barato que pagar exceso en el aeropuerto. Truco: llevar una bolsa plegable de ida para consolidar todo de regreso sin pagar pieza extra."}],"SE":[{"t":"Dormir en el aeropuerto","tag":"recomendada","x":"Incheon está hecho para esto. No pasan migración, no cargan maletas si van facturadas, y llegan al vuelo de catorce horas habiendo dormido.","li":["Gratis: zonas de descanso con sillones reclinables en T2, cerca de las puertas 231 y 268. Se llenan hacia medianoche, así que hay que ir directo al bajar.","Barato: Spa on Air, desde ~₩20,000. Baños coreanos y zonas para dormir. Hay sucursal en T2.","Cómodo: Darakhyu, el hotel cápsula de Walkerhill, desde ~₩62,000 la noche. Los bloques nocturnos arrancan a las 20:00 y se agotan rápido."]},{"t":"Hotel junto al aeropuerto","tag":"alternativa","x":"Cama normal, regadera y desayuno. La contra es pasar migración de ida y volver a pasar seguridad en la mañana, con riesgo de fila a esa hora.","li":["Desde ~₩100,000 la noche.","Por una noche de 7 horas efectivas, la diferencia contra la cápsula no siempre se justifica."]},{"t":"Salir a Seúl de madrugada","tag":"no recomendada","x":"Sobre el papel alcanza, pero los horarios no ayudan. Salen de migración cerca de las 23:40 y el último AREX pasa alrededor de medianoche. Si lo alcanzan, llegan a Seúl pasada la una con todo cerrado salvo las zonas de vida nocturna, y hay que estar de regreso antes de las 09:10.","li":["AREX expreso: T2 a Seoul Station en 51 min, ₩13,000 por persona.","El guarda-equipaje cierra entre 22:00 y 23:00.","Resultado: cero horas de sueño antes de un vuelo de catorce horas."]},{"t":"Transit tour gratis del aeropuerto","tag":"no aplica","x":"Incheon ofrece recorridos gratuitos de 1 a 6 horas a templos, la ciudad de Incheon y Seúl, pensados exactamente para escalas como esta.","li":["El problema es el horario: corren de día y hay que estar de vuelta a las 09:10.","No hay ventana donde encajen. Vale tenerlo en mente para un viaje futuro."]}],"VU":[{"cod":"AM 0058","ln":"Aeroméxico","de":"Ciudad de México T2","a":"Tokio – Narita T1","sale":"mar 8 dic · 21:45","llega":"jue 10 dic · 06:30","dur":"17 h 45 min","nota":"Directo con una parada técnica de ~1 h 16 min en Puerto Vallarta. No se baja nadie del avión.","asiento":"21G","checkin":"2026-12-07T21:45:00-06:00","checkinTxt":"lun 7 dic · 21:45 (hora de México)"},{"cod":"KE 0714","ln":"Korean Air","de":"Tokio – Narita T1","a":"Seúl – Incheon","sale":"sáb 19 dic · 20:40","llega":"sáb 19 dic · ~23:05","dur":"~2 h 25 min","nota":"Localizador propio: CQLDC6. Los asientos de este tramo se manejan con Korean Air, no con Aeroméxico.","asiento":"38B","checkin":"","checkinTxt":""},{"cod":"AM 0091","ln":"Aeroméxico","de":"Seúl – Incheon","a":"Ciudad de México T2","sale":"dom 20 dic · 11:40","llega":"dom 20 dic · 10:35","dur":"~13 h 55 min","nota":"Llega el mismo día por el cambio de huso horario. Entre el KE 0714 y este vuelo hay unas 12 h 35 min de escala.","asiento":"31G","checkin":"2026-12-18T20:40:00+09:00","checkinTxt":"vie 18 dic · 20:40 (hora de Japón)"}],"FE":[{"t":"Reservar AIST-Cube","iso":"2026-11-11T00:00:00-06:00","txt":"mié 11 de noviembre","x":"Abre la ventana de reserva, un mes exacto antes. No se puede antes.","link":"https://forms.office.com/r/QdazR3NTBk"},{"t":"Shibuya SKY · primera alarma","iso":"2026-11-12T09:00:00-06:00","txt":"jue 12 de noviembre, 9:00 am","x":"Posible apertura para el 11 de diciembre, si la ventana es de 28 días.","link":"https://www.shibuya-scramble-square.com/sky/ticket"},{"t":"Shibuya SKY · segunda alarma","iso":"2026-11-26T09:00:00-06:00","txt":"jue 26 de noviembre, 9:00 am","x":"La otra posible apertura, si la ventana es de 14 días. Los slots de atardecer se agotan en minutos.","link":"https://www.shibuya-scramble-square.com/sky/ticket"},{"t":"Check-in del vuelo de ida","iso":"2026-12-07T21:45:00-06:00","txt":"lun 7 de diciembre, 21:45","x":"Abre 24 h antes. Es cuando se liberan los asientos que estaban bloqueados.","link":""},{"t":"Salida de México","iso":"2026-12-08T21:45:00-06:00","txt":"mar 8 de diciembre, 21:45","x":"AM 0058 desde la Terminal 2.","link":""}],"CN":{"tokio":"Tokio","tsukuba":"Tsukuba","nagoya":"Nagoya","kioto":"Kioto","osaka":"Osaka"},"TC":9,"CKB":["Pasaporte","IC card cargada (Suica / ICOCA)","Batería portátil","Efectivo en yenes"],"CKD":{"1":["Activar la eSIM antes de salir del aeropuerto","Comprar las dos IC card en la máquina","Dejar las maletas en el hotel, el check-in es hasta las 15:00","Llegar 15 min antes al Pokémon Café: son estrictos con la hora"],"2":["Correo de confirmación de AIST-Cube","Verificar que JAXA abra ese día","Boleto de Shibuya SKY: el slot es a las 16:00"],"3":["Abrigo grueso, gorro y guantes: en Daikoku pega el viento de la bahía","Monedas para las vending machines del área de servicio","Estar en el punto de encuentro a las 15:30"],"4":["Entregar las maletas en recepción AYER para el takkyubin","Boletos del shinkansen comprados","Al llegar a Kioto: pedir las maletas en recepción"],"5":["Salir antes de las 7:00 para llegar a Fushimi vacío","Zapatos cómodos: son escaleras hasta Yotsutsuji"],"6":["EFECTIVO para Kinkaku-ji: no aceptan tarjeta y no hay cajero cerca"],"7":["Check-out a las 11:00 en punto","Reservar la función del planetario al llegar al museo","El check-in en Osaka es hasta las 15:00"],"8":["App de USJ instalada y con sesión iniciada","Activar el Area Timed Entry de Super Nintendo World AL ENTRAR","Entrar con snacks: adentro todo cuesta más"],"9":["Revisar el horario del bus #29 la noche anterior","Salir del hotel a las 6:45","Comprar el daruma en Katsuo-ji"],"10":["Pasaporte a la mano para el tax-free","Check-out a las 10:00","SALIR DEL HOTEL A LAS 12:30 SIN EXCEPCIÓN","Lo que documentes en Narita no lo ves hasta México"]},"SB":[{"g":"Moverse sin pensar","it":[{"t":"Llegar a Narita y salir del aeropuerto","r":"Aterrizamos a las 6:30 am del jueves 10. Esto es exactamente lo que sigue, en orden.","li":["Al bajar del avión seguimos los letreros <b>Arrivals / 到着</b>. No hay que decidir nada: es un solo pasillo.","Primero cuarentena (un mostrador que casi siempre está vacío), después <b>Inmigración</b>. Nos formamos en la fila que dice <b>Foreign Passports</b>.","En Inmigración: pasaporte, huellas de los dos índices y foto. Si llenamos Visit Japan Web, mostramos el QR; si no, nos dan la tarjeta de desembarque en el avión y la llenamos ahí mismo.","Bajamos por el equipaje documentado. En la banda hay que fijarse en el número de vuelo del tablero, no en el nombre de la aerolínea.","<b>Aduana</b>: segundo QR (o la forma de papel). Preguntan si traemos comida o más de 1 millón de yenes. Respuesta honesta y pasamos.","Salimos a la sala de llegadas del <b>piso 1 de la Terminal 1</b>. Ahí hay baños, agua y cajeros.","Encendemos la eSIM de Holafly. Hay que <b>activarla desde México antes del vuelo</b>; al aterrizar solo se prende el roaming de datos.","Compramos las tarjetas IC (ver el punto siguiente) y de ahí al tren. Todo esto toma entre 50 y 80 minutos desde que se abre la puerta del avión."]},{"t":"La tarjeta IC: lo único que de verdad hay que entender","r":"Una tarjeta recargable que sirve para casi todo. Con esto se elimina el 90% de las decisiones del viaje.","li":["Sirve para: tren, metro, autobús, lockers, konbini, máquinas de refresco, muchos restaurantes y hasta máquinas de pachinko.","Dónde: máquinas automáticas en la estación de Narita, en el piso B1 de la Terminal 1. Tienen botón de <b>English</b>.","Cuál: <b>Suica</b> o <b>Pasmo</b> normal (¥500 de depósito reembolsable) o <b>Welcome Suica</b> (sin depósito, vence a los 28 días). Cualquiera funciona en Tokio, Kioto y Osaka.","Cuánto cargar: <b>¥3,000 por persona</b> para empezar. Se recarga en cualquier estación o konbini.","Cómo se usa: se toca el lector al <b>entrar</b> y otra vez al <b>salir</b>. Si solo se toca al entrar, el torniquete de salida se cierra.","Si no alcanza el saldo al salir: la máquina <b>Fare Adjustment</b> (ajuste de tarifa) está junto a los torniquetes. Se mete la tarjeta, se paga la diferencia y listo.","Importante: el <b>shinkansen y el Narita Express no se pagan con IC</b>. Esos llevan boleto aparte."]},{"t":"Leer la estación: el andén correcto en 10 segundos","r":"Las estaciones japonesas están sobreseñalizadas. El truco es saber qué tres datos buscar.","li":["Cada estación tiene un <b>código de letra + número</b> (Ginza es G-09, Shibuya es JY-20). Si el código coincide, es la estación, aunque el nombre esté en kanji.","El tablero da tres cosas: <b>hora</b>, <b>destino final</b> y <b>número de andén</b> (番線, <i>bansen</i>). Lo único que hay que memorizar es el destino final de la línea en nuestra dirección.","Cada línea tiene color propio y ese color se repite en el piso, en la columna y en el tren. Si vamos siguiendo verde y de pronto hay naranja, nos pasamos.","En el piso del andén hay <b>marcas numeradas</b>: ahí se abre cada puerta. Nos formamos en la marca, se abre la puerta exactamente ahí.","Tipos de tren en la misma vía: <b>Local</b> (para en todas), <b>Rapid / Express</b> (se salta estaciones). Si nuestra estación es chica, hay que tomar Local.","En hora pico el primer vagón puede ser <b>solo mujeres</b> (letrero rosa). Aplica de lunes a viernes por la mañana."]},{"t":"Tax-free: cambió el 1 de noviembre de 2026","r":"Justo antes de nuestro viaje. Ahora se paga el impuesto en la tienda y se recupera en Narita el día que salimos.","li":["Mínimo: <b>¥5,000 antes de impuesto</b> en la misma tienda el mismo día. Ya se puede sumar ropa con comida: desapareció la división entre bienes generales y consumibles.","Ya <b>no existe la bolsa sellada</b> que no se podía abrir. Pero lo que nos comamos o usemos en Japón sigue sin calificar.","En la tienda: mostramos el <b>pasaporte físico</b> (o el QR de Visit Japan Web) y pagamos el <b>precio completo con impuesto</b>. La tienda registra la compra electrónicamente.","En Narita el 19 de diciembre: <b>antes de documentar las maletas</b>, pasamos al kiosco de aduana, escaneamos el pasaporte y, si lo piden, mostramos la mercancía. Hay que traerla a mano.","El reembolso llega en efectivo en el aeropuerto, a la tarjeta o por app, según lo que cada tienda haya elegido. Conviene <b>preguntarlo en la caja</b> al comprar.","Plazo: 90 días desde la compra. Todo nuestro viaje cae dentro, no hay riesgo.","Conclusión práctica: el pasaporte va en la mochila todos los días que pensemos comprar algo caro."]},{"t":"Lockers: dónde dejamos las cosas","r":"Resuelven los días con traslado y las tardes con maleta.","li":["Se llaman <b>コインロッカー</b> (coin locker). Hay en todas las estaciones medianas y grandes.","Tamaños y precio por día: chico ¥400 (mochila), mediano ¥600 (maleta de cabina), grande ¥700 a ¥1,000 (maleta documentada).","Se pagan con <b>tarjeta IC</b> o monedas de ¥100. Los nuevos dan un recibo con código en lugar de llave: <b>no se pierde ese papel</b>.","Se vacían a medianoche o al tercer día, según el letrero. Para un día no hay problema.","Si están todos ocupados, en las estaciones grandes hay <b>oficina de equipaje</b> con personal, un poco más cara pero siempre con espacio.","En estaciones enormes (Kioto, Osaka, Tokio) hay <b>pantallas que muestran qué lockers están libres</b> y en qué pasillo."]},{"t":"En diciembre oscurece a las 4:30 de la tarde","r":"Es el dato que más cambia la forma de usar el día, y casi nadie lo toma en cuenta.","li":["En Tokio en diciembre: amanece cerca de las <b>6:40 am</b> y oscurece cerca de las <b>4:30 pm</b>. En Kioto y Osaka, unos 10 minutos más tarde.","Significa que la luz útil son <b>menos de 10 horas</b>. Lo que queramos ver de día hay que verlo antes de las 3:30 pm.","La mayoría de templos y santuarios <b>cierra entre 4:00 y 4:30 pm</b>. Fushimi Inari y Senso-ji son excepciones: el terreno está abierto siempre.","El atardecer es la mejor hora para Shibuya SKY: entrar cerca de las <b>3:40 pm</b> para ver día, puesta de sol y ciudad iluminada en una sola visita.","Ventaja: las iluminaciones de invierno encienden temprano y los barrios de noche (Dotonbori, Den Den Town, Akihabara) se ven increíbles desde las 5 pm.","Hace frío de verdad: 4 a 11 °C de día y cerca de 2 °C al amanecer en la montaña de Katsuo-ji."]},{"t":"Taxi, cuando ya no hay tren","r":"Pasa en los días que terminan tarde: Daikoku, Dotonbori, Den Den Town.","li":["El último tren sale entre <b>00:00 y 00:30</b>. Después de esa hora no hay metro hasta las 5 am.","Apps que funcionan con tarjeta extranjera: <b>GO</b> (la japonesa, la mejor) y <b>Uber</b> (en Tokio y Osaka llama taxis normales).","En la calle: letrero rojo en el parabrisas (空車) significa libre. Se levanta la mano.","<b>La puerta se abre y se cierra sola.</b> No hay que tocarla, y cerrarla a mano se considera brusco.","Se le muestra al taxista el <b>nombre del hotel en japonés</b> desde la app (está en el botón «En japonés» de cada lugar). No hay que pronunciar nada.","Pagan con IC, tarjeta o efectivo. <b>No se da propina</b>, y el cambio se devuelve completo."]}]},{"g":"Costumbres: no quedar mal sin saberlo","it":[{"t":"Templos y santuarios","r":"Budista es templo (-ji, -dera), sintoísta es santuario (-jingu, -jinja, -taisha). El protocolo es distinto.","li":["<b>Santuario</b> (Meiji Jingu, Fushimi Inari, Yasaka): al pasar el torii, caminar por <b>un lado</b> del camino, no por el centro, que es el paso de los dioses.","En la fuente de agua (temizuya): cucharón en la derecha, se lava la mano izquierda; se cambia de mano, se lava la derecha; se pone agua en la mano izquierda y se enjuaga la boca <b>sin tocar el cucharón con los labios</b>; se para el cucharón para que el agua limpie el mango.","Para rezar en un santuario: moneda a la caja, <b>dos reverencias, dos palmadas, una reverencia</b>. En Fushimi y Yasaka se hace así.","<b>Templo budista</b> (Senso-ji, Kinkaku-ji, Katsuo-ji): se juntan las manos y se hace una reverencia. <b>No se aplaude.</b>","En Senso-ji, el humo del incensario grande se echa con la mano hacia donde queramos salud. Es tradición, no obligación.","Fotos: afuera siempre sí; <b>adentro del salón principal casi siempre no</b>. Si hay un letrero con una cámara tachada, se guarda el teléfono.","No se entra a un santuario con comida en la mano ni se come en el terreno. Hay bancas y zonas marcadas para eso."]},{"t":"No hay botes de basura en la calle","r":"Es la sorpresa más incómoda para quien llega por primera vez.","li":["Desaparecieron en los noventa por razones de seguridad y nunca volvieron. En una calle de Tokio no vas a encontrar ninguno.","Dónde sí hay: dentro de los <b>konbini</b> (junto a la caja), en los andenes de tren, junto a las <b>máquinas expendedoras</b> (solo para botes y botellas) y en los baños públicos.","La solución real: una <b>bolsa de plástico en la mochila</b>. Todo lo que generemos en el día se guarda ahí y se tira en el hotel o en un konbini.","No se come caminando. Si compramos algo en la calle, se come ahí parado junto al puesto y se tira ahí mismo.","La basura se separa: 燃えるゴミ (quemable), プラ (plástico), 缶・びん (lata y vidrio). Si hay duda, el papel va a quemable."]},{"t":"En el restaurante","r":"Las reglas que importan son pocas y hacen mucha diferencia.","li":["Al entrar gritan <b>irasshaimase</b> (bienvenido). No hay que contestar nada, basta un gesto con la cabeza.","Se espera a que indiquen la mesa. Sentarse solo es mal visto, hasta en lugares informales.","Casi siempre llega una <b>toallita</b> (oshibori): es para las manos, no para la cara ni para la mesa.","Sorber los noodles <b>está bien visto</b>: enfría el caldo y se considera que se disfruta la comida. Con el arroz no.","<b>Nunca se clavan los palillos verticalmente en el arroz</b> ni se pasa comida de palillo a palillo: las dos cosas son gestos de funeral.","No se pide la cuenta en la mesa: se lleva el papelito a la <b>caja de la entrada</b>. Si no hay papel, se dice <i>o-kaikei onegaishimasu</i>.","<b>No hay propina.</b> Dejar dinero en la mesa confunde; a veces lo persiguen a uno para devolverlo.","El agua y el té son <b>gratis y de cortesía</b>, se rellenan sin pedir. A veces hay una jarra en la mesa."]},{"t":"El baño japonés","r":"Entre el mejor del mundo y el más confuso, a veces en el mismo edificio.","li":["El panel del washlet tiene dos botones clave: <b>おしり</b> (chorro trasero) y <b>止</b> o un cuadrado rojo (<b>parar</b>). Ese cuadrado rojo es el botón importante.","El botón con una nota musical o 音姫 es solo <b>ruido de agua</b> para dar privacidad. No descarga.","La descarga suele ser una palanca en la pared o un botón grande que dice <b>大</b> (mucha agua) y <b>小</b> (poca).","El asiento está caliente. No está roto.","En baños tradicionales hay <b>inodoro de piso</b>: se usa en cuclillas, de frente a la campana.","Casi nunca hay papel para secarse las manos ni secadora. Todos los japoneses cargan un <b>pañuelo de tela</b>; vale la pena comprar uno en un konbini el primer día.","Los baños públicos de estación y konbini están limpios y son gratis. No hay que buscar un café para entrar al baño."]},{"t":"En el tren y en la calle","r":"Lo que separa a un visitante discreto de uno incómodo.","li":["<b>No se habla por teléfono en el tren.</b> El teléfono va en silencio (マナーモード, modo buenos modales). Sí se puede chatear o ver video con audífonos.","No se come ni se bebe en los trenes urbanos. En el <b>shinkansen sí</b>: ahí es normal y hasta se venden bentos.","La mochila grande se baja del hombro y se carga <b>adelante o entre los pies</b>, no en la espalda.","Las escaleras eléctricas: en Tokio se para a la <b>izquierda</b>, en Osaka y Kioto a la <b>derecha</b>. El lado libre es para quien camina.","Se camina por el lado que marquen las flechas del piso. En pasillos de estación la dirección es obligatoria en la práctica.","No se señala con el dedo a personas. Se usa la mano abierta.","Los asientos del extremo marcados en gris o naranja son <b>prioritarios</b>: se ceden sin pensar."]},{"t":"Dinero, zapatos y otros detalles","r":"Pequeños, pero se notan.","li":["El dinero <b>no se pone en la mano</b>: hay una bandejita de plástico en la caja. Ahí se deja y ahí devuelven el cambio.","Japón sigue siendo bastante de efectivo. Los templos, los buses de montaña y los puestos chicos <b>solo aceptan monedas y billetes</b>.","Se acumulan muchas monedas de ¥1, ¥5, ¥10, ¥50, ¥100 y ¥500. Conviene gastarlas en los konbini y en las máquinas, no acumularlas.","<b>Zapatos fuera</b>: en algunos restaurantes con tatami, en templos donde se entra al salón, en casas y en algunos probadores. Si ves un escalón y zapatos acomodados, ahí se quitan.","Hay que llevar <b>calcetines sin agujeros</b>. Suena a broma y no lo es.","No se habla fuerte en espacios cerrados. El volumen normal de una conversación mexicana se escucha alto allá.","Las reverencias no son obligatorias para un extranjero, pero una inclinación corta de cabeza funciona para dar gracias, pedir permiso y disculparse."]}]},{"g":"Comida sin hablar japonés","it":[{"t":"La máquina de boletos del restaurante","r":"El sistema más común en ramen, curry, gyudon y soba. Da miedo la primera vez y después es lo más fácil del viaje.","li":["Se llama <b>食券機</b> (shokkenki). Está a la entrada, antes de las mesas.","Paso 1: meter el dinero <b>primero</b>. Billetes y monedas. Muchas aceptan tarjeta IC.","Paso 2: apretar el botón del platillo. El <b>botón de arriba a la izquierda suele ser el platillo estrella</b> de la casa. Casi siempre hay foto.","Paso 3: salen uno o varios boletos y el cambio. Se recoge todo.","Paso 4: se entrega el boleto al cocinero o se deja en la mesa. Ya no hay que pedir ni pagar nada más.","Si la máquina solo tiene kanji: botón más grande y más arriba = lo más pedido. No hay forma de equivocarse grave.","Botones chicos abajo son extras: <b>替玉</b> (más noodles), <b>大盛</b> (porción grande), <b>味玉</b> (huevo marinado).","Si nos trabamos, hay un botón de <b>呼出</b> (llamar) y sale alguien a ayudar sin molestarse."]},{"t":"El konbini es la mejor comida barata de Japón","r":"7-Eleven, FamilyMart y Lawson. No es gasolinera: es comida de verdad, fresca y buena.","li":["Desayuno perfecto: <b>onigiri</b> (¥150 a ¥250), sándwich de huevo, café de máquina (¥150). Los tres juntos cuestan menos de ¥600.","Para calentar: se entrega en la caja y preguntan <i>atatamemasu ka?</i> La respuesta es <b>hai</b> (sí).","Lo que de verdad hay que probar: el <b>sándwich de huevo de 7-Eleven</b>, el pollo frito <b>karaage-kun</b> de Lawson, el <b>café con leche</b> embotellado y el helado de 7-Eleven.","Los onigiri tienen un plástico con 1-2-3 numerado: se jala en ese orden y el alga queda crujiente sin tocarla.","Ahí se paga de todo: boletos de conciertos, paquetería, recargar la IC, imprimir documentos y sacar efectivo de tarjeta extranjera (el ATM de 7-Eleven es el que siempre funciona).","Baño limpio y gratis, agua caliente para sopas instantáneas y <b>el único bote de basura confiable en la calle</b>.","Abren 24 horas. En los días de traslado largo, es la red de seguridad."]},{"t":"Qué comer en cada ciudad de nuestro viaje","r":"Un platillo que sí vale la pena buscar en cada zona, sin desviarnos del itinerario.","li":["<b>Asakusa (día 1):</b> <i>tempura</i> en los locales viejos de Nakamise, y <i>melonpan</i> recién hecho en la calle de atrás del templo.","<b>Akihabara (día 1):</b> curry japonés y <i>katsu</i>. Es la comida de los pisos altos de los edificios de electrónica, barata y abundante.","<b>Harajuku (día 3):</b> la <i>crepe</i> de Takeshita Street ya está en el plan. Alrededor hay buen <i>gyoza</i> y <i>tonkatsu</i>.","<b>Nagoya (día 4):</b> el único día que pasamos por ahí. Lo local es <b>miso katsu</b> (chuleta con miso rojo) y <b>hitsumabushi</b> (anguila). La estación de Nagoya tiene un piso completo de esto.","<b>Kioto (días 5, 6, 7):</b> <i>yudofu</i> (tofu en caldo), <i>obanzai</i> (platitos de temporada) y el <i>matcha</i> de verdad. En Fushimi, el <b>inari-zushi</b> de los puestos del camino.","<b>Osaka (días 7 a 10):</b> es la capital de la comida de calle. <b>Takoyaki</b>, <b>okonomiyaki</b> y <b>kushikatsu</b> (brochetas empanizadas). En kushikatsu la regla sagrada: <b>la salsa se moja una sola vez</b>.","<b>Dotonbori (día 7):</b> ya está en el plan y es el mejor lugar para los tres de arriba, aunque sea el más turístico.","<b>Den Den Town (día 9):</b> ramen y curry barato entre tiendas de electrónica, estilo Akihabara pero en Osaka."]},{"t":"Pedir, preguntar y salir sin hablar","r":"Siete frases y dos gestos resuelven todo el viaje.","li":["<b>Sumimasen</b> — perdón / disculpe / oiga. Sirve para pedir la cuenta, llamar a alguien y pasar entre la gente. Es la palabra más útil de Japón.","<b>Kore o kudasai</b> — «esto, por favor», señalando la foto del menú. Con esto se pide cualquier cosa.","<b>Eigo no menyū arimasu ka?</b> — «¿hay menú en inglés?». En zonas turísticas casi siempre sí.","<b>O-kaikei onegaishimasu</b> — «la cuenta, por favor».","<b>Oishii!</b> — «está delicioso». Cambia el trato por completo.","<b>Gochisōsama deshita</b> — se dice al salir, significa «gracias por la comida». Es de buena educación.","<b>Arigatō gozaimasu</b> — gracias. Nunca sobra.","Los dos gestos: la <b>X con los brazos</b> significa no o cerrado, y la <b>mano abierta hacia adentro</b> significa pase. Si alguien hace la X, no hay que insistir.","Google Translate con la cámara lee menús completos. Hay que <b>descargar el japonés para usar sin internet</b> antes de salir."]},{"t":"Horarios: la comida tiene reloj","r":"La causa número uno de quedarse sin comer en Japón.","li":["Comida: de <b>11:30 am a 2:00 pm</b>. Muchos locales buenos cierran en punto y vuelven a abrir en la noche.","Cena: de <b>5:30 a 9:00 pm</b>. La última orden (<i>last order</i>) suele ser 30 a 60 minutos antes de cerrar.","Entre 2 y 5 de la tarde muchos restaurantes están <b>cerrados</b>. Ahí entran los konbini, los cafés y las cadenas de 24 horas.","Los restaurantes de los pisos de arriba de las estaciones y los centros comerciales <b>no cierran a media tarde</b>: son la solución cuando se nos pasa la hora.","En nuestros días largos (2, 3, 8 y 9) hay que <b>comer cuando se pueda, no cuando haya hambre</b>. Un onigiri en la mochila evita tronar a las 4 pm.","El desayuno de hotel en Japón arranca temprano, normalmente de 7 a 9:30 am."]}]},{"g":"Específico de este viaje","it":[{"t":"Universal Studios Japan hora por hora (día 8)","r":"Un día entero, y la diferencia entre 6 atracciones y 14 está en la primera hora.","li":["Hay que <b>revisar el horario oficial una semana antes</b>: en diciembre abre entre 8:30 y 9:30 y cierra entre 7 y 9 pm, y cambia día con día.","Llegar <b>45 minutos antes de la apertura</b>. El parque suele abrir las puertas antes de la hora oficial cuando hay fila.","Primera hora, lo que se hace y nada más: entrar directo a <b>Super Nintendo World</b> si no hubo que sacar Area Timed Entry, o a <b>Hollywood Dream</b> si sí.","Nintendo World puede requerir <b>Area Timed Entry</b> gratis desde la app oficial, y se agota temprano. Hay que sacarlo <b>en el momento de entrar al parque</b>, no después.","Mañana (hasta las 12): las montañas rusas. Flying Dinosaur, Hollywood Dream, Backdrop.","Comida: <b>antes de las 11:30 o después de las 2</b>. De 12 a 2 las filas de comida son de 40 minutos.","Tarde: Harry Potter. El castillo y <b>Forbidden Journey</b>, además de la varita en Ollivanders si interesa.","Última hora y media: lo que se repita o lo que haya quedado. Las filas bajan mucho los últimos 60 minutos.","Descargar la <b>app oficial de USJ</b> antes del viaje: muestra las filas en tiempo real y es la única forma de sacar los pases de área.","Lleva batería portátil. El teléfono se vacía con la app abierta todo el día."]},{"t":"El lado del Fuji en el shinkansen (días 4 y 10)","r":"Pasamos dos veces junto al Fuji y diciembre es el mejor mes del año para verlo.","li":["En el Tokaido Shinkansen el Fuji se ve desde los <b>asientos D y E</b>, en las dos direcciones. Son el lado de dos asientos del vagón.","<b>Día 4, Tokio → Nagoya:</b> el Fuji aparece unos <b>40 a 45 minutos después de salir de Tokio</b>, del lado derecho. Entre las estaciones de Shin-Fuji y Mishima.","<b>Día 10, Osaka → Tokio:</b> aparece unos <b>40 minutos antes de llegar a Tokio</b>, del lado izquierdo. Mismos asientos D y E.","Diciembre y enero son los meses de <b>cielo más claro</b> del año en esa zona. Las probabilidades por la mañana son muy buenas.","La ventana se ve bien unos <b>3 a 5 minutos</b>. Vale la pena tener el teléfono listo y no estar dormido en ese tramo.","Si no hay asiento D o E, el pasillo del vagón permite asomarse sin molestar a nadie.","Dato: desde el lado contrario no se ve nada relevante. No es exageración, es una montaña de 3,776 metros contra edificios."]},{"t":"Mandar las maletas por takkyubin (día 4)","r":"El día que vamos de Tokio a Kioto con escala en Nagoya para el Museo Toyota. Las maletas no van con nosotros.","li":["El servicio se llama <b>takkyūbin</b> (宅急便). El principal es <b>Yamato</b>, el del gato negro en el logo.","Dónde se manda: en la <b>recepción del hotel de Tokio</b>. Todos lo hacen y es el camino más simple. También en cualquier konbini.","Cuándo: la noche del día 3 o <b>en el check-out del día 4 a las 11 am</b>. Entrega al día siguiente dentro del mismo país.","Costo: alrededor de <b>¥2,000 a ¥2,600 por maleta</b> de Tokio a Kioto.","La forma la llena la recepción con los datos del hotel de Kioto. <b>Hay que llevar escrito el nombre, la dirección y el teléfono del hotel de Kioto</b>, y la fecha de llegada.","Se queda un <b>recibo con número de rastreo</b>. Se le toma foto y se guarda el papel.","Lo que no se manda: pasaporte, medicinas, electrónica, cargadores, y una muda de ropa. Todo eso va en la mochila del día.","Al llegar a Kioto las maletas ya están en recepción. Se dice el nombre y las entregan.","Importante: así subimos al shinkansen y al Museo Toyota <b>solo con mochila</b>, que es la única forma de que ese día funcione."]},{"t":"Daikoku PA (día 3)","r":"El punto de encuentro JDM más famoso del mundo, y el único lugar del viaje al que no se puede llegar solo.","li":["No tiene acceso peatonal ni estación de tren. Es un área de servicio dentro de una autopista elevada. <b>El tour es la única forma.</b>","Empieza a las <b>4:00 pm</b>. Hay que estar en el punto de encuentro 15 minutos antes.","El punto de encuentro y el nombre del guía están en el correo de confirmación. Hay que tenerlo <b>descargado, no solo en el correo</b>.","Lleva efectivo: dentro del área de servicio hay máquinas y tienda, y no todo acepta tarjeta.","Hace frío y hay viento, es un puente sobre la bahía. <b>Chamarra de verdad</b>, no sudadera.","Etiqueta del lugar: <b>no se toca ningún coche</b>, ni para apoyar la mano. Para fotos de cerca se pide permiso con un gesto y se espera el sí.","Si el dueño niega con la cabeza o hace la X, se agradece y se sigue caminando. Es su coche y mucha gente va a mostrar, no a ser fotografiada.","Termina de noche. Ese día no hay nada después: se vuelve al hotel y se duerme."]},{"t":"Katsuo-ji al amanecer (día 9)","r":"El día más temprano del viaje, y la razón vale la pena.","li":["Es el <b>templo de los daruma</b>: miles de muñecos rojos de todos los tamaños acomodados en las escaleras, las rocas, los puentes y los huecos de los árboles. No hay otro lugar igual.","Está en la montaña de Minoh, arriba de Osaka. El camino es <b>tren hasta Minoh y después autobús</b>.","El autobús cuesta cerca de <b>¥800 por persona por tramo</b> y acepta efectivo. Hay que llevar monedas.","Vamos temprano a propósito: a esa hora hay niebla entre los árboles, casi no hay gente y la luz es la mejor del día. Después de las 10 am llegan los camiones de turistas.","Hace frío de montaña en diciembre: cerca de <b>2 °C al amanecer</b>. Capas, no una sola chamarra gruesa.","La tradición del daruma: se compra uno, se le pinta <b>un solo ojo</b> y se pide un deseo. El otro ojo se pinta cuando se cumple. Los que están en el templo son de deseos cumplidos que la gente regresó.","Cuesta ¥400 la entrada. Efectivo.","Es templo budista: se juntan las manos y se hace reverencia. <b>No se aplaude.</b>"]},{"t":"Pokémon Café (día 1)","r":"La reserva más frágil del viaje. Klook confirma 48 horas antes, o no.","li":["Está en <b>Nihonbashi</b>, en el piso 5 de Takashimaya. La entrada es por el edificio del centro comercial, no por la calle.","La confirmación de Klook llega <b>48 horas antes</b>. Si llega un no, el <b>Pokémon Center DX</b> está en el mismo piso y no necesita reserva.","Hay que llegar <b>15 minutos antes</b> con la confirmación en pantalla y el pasaporte.","La visita dura unos <b>90 minutos</b> y es bloque fijo: no se puede llegar tarde ni quedarse más.","La comida es temática y correcta, no extraordinaria. Lo que la gente va a buscar es el <b>vaso y el plato de recuerdo</b>, que se compran ahí mismo.","Aparece Pikachu unos minutos. Es el momento de la foto.","Cae el mismo día que llegamos, con el desfase horario encima. Es la última cosa del día 1 a propósito: después de eso, hotel."]}]},{"g":"Otros detalles que sí importan","it":[{"t":"La mochila del día","r":"Lo que se carga todos los días sin pensarlo.","li":["<b>Pasaporte.</b> Legalmente hay que traerlo siempre, y sin él no hay tax-free ni entrada a algunos museos con descuento.","<b>Batería portátil</b> cargada. Entre mapas, traductor, fotos y la app de USJ, el teléfono no aguanta un día completo.","<b>Efectivo en monedas y billetes chicos</b>: templos, autobuses de montaña, lockers y puestos. ¥5,000 al día entre los dos es cómodo.","<b>Tarjeta IC</b> con saldo. Conviene revisarla en la noche, no en el torniquete.","<b>Pañuelo de tela</b> para secarse las manos y una <b>bolsa de plástico</b> para la basura del día.","<b>Paraguas chico</b>. Llueve poco en diciembre pero cuando llueve no avisa, y uno de konbini cuesta ¥600.","<b>Capas de ropa</b>: afuera son 5 °C y adentro de los trenes y tiendas son 24 °C. Una chamarra sola no sirve; una playera, un suéter y una chamarra sí.","Las confirmaciones de reserva <b>descargadas</b>, no solo en el correo. Si no hay señal, el correo no abre."]},{"t":"Si llueve o algo se cae del plan","r":"Plan B por día, para no improvisar con frío.","li":["<b>Día 1 (Tokio):</b> Akihabara es de puros edificios cerrados. El plan ya aguanta lluvia completa.","<b>Día 2 (Tsukuba):</b> AIST y JAXA son interiores. Si falla el Shibuya SKY por mal tiempo, se cambia por el <b>Shibuya Scramble desde el Starbucks</b> o se recorre el centro comercial de la estación.","<b>Día 3 (Harajuku y Daikoku):</b> el tour de Daikoku sale con lluvia. Para la mañana, los pisos de <b>Takeshita y Omotesando</b> son techados.","<b>Día 4 (Nagoya):</b> el Museo Toyota es interior y el resto es tren.","<b>Día 5 (Fushimi):</b> el camino del torii es al aire libre. Si llueve fuerte, los puestos de la base dan techo y la <b>estación de Kioto</b> tiene museos y un piso de restaurantes enorme.","<b>Día 6 (Kinkaku-ji):</b> el pabellón dorado con lluvia y poca gente es mejor que con sol. No hay plan B necesario.","<b>Día 7 (Osaka):</b> el Museo de Ciencia es interior. <b>Cierra lunes y martes</b>, y nuestro día es miércoles: está bien, pero conviene confirmar la semana antes.","<b>Día 8 (Universal):</b> abre con lluvia y las filas bajan mucho. Impermeable de ¥500 del parque y se aprovecha.","<b>Día 9 (Katsuo-ji):</b> es el único que la lluvia arruina de verdad, por la montaña. Si el pronóstico es malo, se cambia el orden: castillo y Den Den Town primero, templo otro día.","<b>Día 10:</b> es día de traslado. La lluvia no lo afecta."]},{"t":"Souvenirs: qué sí y dónde","r":"Para no cargar cosas de aeropuerto el último día.","li":["Lo mejor y más barato está en los <b>konbini y supermercados</b>: KitKat de sabores, snacks regionales, café embotellado, dulces. Mucho más que en las tiendas de souvenirs.","<b>Don Quijote</b> (ドン・キホーテ): abierto hasta tarde, de todo, y hace tax-free en el mismo piso. Hay en Shibuya, Dotonbori y Den Den Town.","Por zona: <b>Akihabara y Den Den Town</b> para figuras y electrónica, <b>Nakamise en Asakusa</b> para artesanía tradicional, <b>Kioto</b> para matcha, abanicos y cerámica, <b>Universal</b> para lo del parque.","El <b>daruma de Katsuo-ji</b> es el mejor recuerdo del viaje y solo se consigue ahí.","Las <b>gachapon</b> (máquinas de cápsulas) cuestan ¥300 a ¥500 y son el souvenir más divertido. Hay pasillos completos en Akihabara.","No comprar en el aeropuerto salvo que falte algo: es más caro y la selección es peor.","Lo pesado y frágil se manda por takkyubin al hotel de Osaka si se compra en Kioto. Cargar cerámica diez días no tiene sentido.","Dejar <b>espacio en la maleta desde México</b>. Es el error clásico."]},{"t":"Dinero: cuánto efectivo y de dónde","r":"Japón acepta tarjeta en casi todo, y en lo que no, no hay plan B.","li":["El <b>ATM de 7-Eleven</b> es el que siempre acepta tarjetas extranjeras, tiene menú en español y está en todas partes. Los de banco japonés muchas veces no.","También funcionan los de <b>Japan Post</b> (oficinas de correo), con horario de oficina.","No conviene cambiar mucho dinero en México: el tipo de cambio del ATM japonés es mejor.","Cuánto traer en efectivo al llegar: <b>¥20,000 a ¥30,000</b> entre los dos alcanza para los primeros dos días. Después se saca según haga falta.","Lo que es <b>solo efectivo</b> en nuestro viaje: entrada y daruma de Katsuo-ji, el autobús de la montaña, muchos puestos de Dotonbori y Nakamise, templos, y algunas máquinas de boletos de restaurante.","Avisar al banco del viaje antes de salir. Una tarjeta bloqueada en Narita a las 7 am es un problema real.","Traer <b>dos tarjetas de bancos distintos</b>, en bolsas separadas. Es la única precaución que de verdad importa.","Las monedas de ¥500 valen cerca de 60 pesos: no son cambio suelto, conviene no perderlas."]},{"t":"Antes de dormir, todas las noches","r":"Cinco minutos que arreglan el día siguiente.","li":["Poner <b>los dos teléfonos a cargar</b> y la batería portátil también.","Revisar el <b>saldo de la tarjeta IC</b> y recargar si quedan menos de ¥1,000.","Abrir la pestaña del día siguiente en esta app y <b>ver la primera hora</b>: a qué hora suena la alarma y a dónde se va primero.","Dejar listo lo que se usa en la mañana: ropa por capas, mochila armada, pasaporte dentro.","Tirar la basura del día y vaciar la bolsa.","Si el día siguiente tiene reserva (días 1, 2, 3, 8), <b>confirmar que está descargada</b> en el teléfono.","Poner la alarma <b>con hora de Japón</b>. Suena obvio y es el error más común los primeros dos días."]}]}]};

            kioto:"var(--kioto)",osaka:"var(--osaka)"};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ICON_GO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>';

function pin(k){const p=D.L[k];if(!p||p.lat==null)return"";
  return `https://www.google.com/maps/search/?api=1&query=${p.lat}%2C${p.lng}`;}
function ruta(a,b){if(a===b)return"";const x=D.L[a],y=D.L[b];if(!x||!y||x.lat==null||y.lat==null)return"";
  if(x.lat===y.lat&&x.lng===y.lng)return"";
  return `https://www.google.com/maps/dir/?api=1&origin=${x.lat}%2C${x.lng}&destination=${y.lat}%2C${y.lng}&travelmode=transit`;}

// ---------------- relojes
function tz(d,z){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:z,hour:"numeric",minute:"2-digit",hour12:true})
    .formatToParts(d);
  const g=t=>(p.find(x=>x.type===t)||{}).value||"";
  return {h:g("hour")+":"+g("minute"), s:g("dayPeriod").toLowerCase()};}
function tick(){const n=new Date();
  for(const [id,z] of [["cmx","America/Mexico_City"],["cjp","Asia/Tokyo"]]){
    const t=tz(n,z), el=document.getElementById(id);
    el.innerHTML=esc(t.h)+'<s>'+esc(t.s)+'</s>';
  }}

function dias(ms){return Math.floor(ms/864e5);}
function cuenta(iso){
  const t=new Date(iso)-new Date();
  if(t<0)return null;
  const d=dias(t),h=Math.floor(t/36e5)%24,m=Math.floor(t/6e4)%60;
  if(d>0)return `faltan ${d} día${d===1?"":"s"}`;
  if(h>0)return `faltan ${h} h ${m} min`;
  return `faltan ${m} min`;}

  const hoy=D.D.find(d=>d.iso===jp);
  let h="";

    const hm=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hour12:false}).format(n);
    const ps=D.P.filter(p=>p.d===hoy.n);
    const act=ps.filter(p=>p.ini<=hm&&(!p.fin||p.fin>hm)).pop();
    const sig=ps.find(p=>p.ini>hm);

      <div class="k">Día ${hoy.n} de 10 · ${esc(hoy.f)}</div>

      <div class="v">${esc(sig.ini)} · ${esc(sig.t)}</div>

  }else if(n<salida){
    const d=dias(salida-n);
    h+=`<div class="hero"><div class="k">Cuenta regresiva</div>
      <div class="big">${d} día${d===1?"":"s"}</div>
      <div class="sub">Para despegar de la Ciudad de México. AM 0058, martes 8 de diciembre a las 21:45.</div></div>`;

    h+=`<div class="hero"><div class="k">El viaje</div><div class="big">Terminado</div>
      <div class="sub">10 al 19 de diciembre de 2026.</div></div>`;
  }

    h+=`<h2 class="sec">Lo que viene</h2><div class="grid2">`;

      <div class="cd">${esc(cuenta(f.iso)||"")}</div>
      ${f.link?`<div class="acts"><a class="go" href="${f.link}" target="_blank" rel="noopener">Abrir ${ICON_GO}</a></div>`:""}
      </div>`;});
    h+=`</div>`;
  }
  h+=`<h2 class="sec">Si te atoras</h2>
    <div class="sos"><div class="k">Ayuda rápida</div>
      <div class="t">Perdido, sin tren, sin batería o sin saldo</div>
      <div class="acts"><button class="go" data-v2="ayuda">Abrir ayuda ${ICON_GO}</button></div></div>`;
  h+=`<h2 class="sec">El viaje de un vistazo</h2><div class="grid2">`;
  D.D.forEach(d=>{h+=`<div class="tile" style="border-left:3px solid ${CC[d.ciudad]}">
    <div class="k">Día ${d.n} · ${esc(d.f.split(" de ")[0])}</div>

    h+=`<label><input type="checkbox" data-ck="${key}"${on?" checked":""}>

      <div class="dot"></div><div class="card">
      <div class="t">${esc(p.t)}</div><div class="x">${esc(p.x)}</div>`;

      if(p.dur&&p.dur!=="—")h+=`<span class="b">${esc(p.dur)}</span>`;
      if(p.act){const e=p.act.estado;
        const cl=e.includes("PAGADO")?"ok":(e==="Gratis"?"":"warn");
        h+=`<span class="b ${cl}">${esc(e)}</span>`;}
      h+=`</div>`;}
    if(lug){
      h+=`<div class="meta"><div><b>Dónde:</b> ${esc(lug.d)}</div>
        <div><b>Cómo llegar:</b> ${esc(lug.c)}</div>`;
      if(p.act&&p.act.reserva)h+=`<div><b>Reserva:</b> ${esc(p.act.reserva)}</div>`;
      h+=`</div><div class="acts">`;
      const r=p.desde?ruta(p.desde,p.lugar):"";
      if(r)h+=`<a class="go p" href="${r}" target="_blank" rel="noopener">${ICON_GO} Cómo llegar${p.desde&&D.L[p.desde]?` <span style="opacity:.75;font-weight:400">desde ${esc(D.L[p.desde].n.split(" (")[0].split(" —")[0])}</span>`:""}</a>`;

      h+=`</div>`;
    }
    h+=`</div></div>`;
  });
  h+=`</div>`;
  document.getElementById("dcont").innerHTML=h;

}
