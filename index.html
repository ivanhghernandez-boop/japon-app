<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<title>Japón</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Japón">
<meta name="theme-color" content="#F4F1EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Japandi: papel de arroz y madera clara, tinta sumi como único acento, mucho aire,
   líneas de un pelo en vez de cajas, y una barra flotante abajo que nunca estorba. */
:root{
  --bg:#F4F1EB; --surface:#FBFAF7; --surface2:#EBE6DD; --line:#DED7CA;
  --fg:#2B2824; --fg2:#6B6357; --fg3:#9C9488;
  --acc:#3C4A5A; --acc-soft:#E4E6EA;
  --alert:#A9603F; --alert-soft:#F2E4DC;
  --ok:#64785C;
  --tokio:#4A5D73; --tsukuba:#6B6076; --nagoya:#8A6A4B; --kioto:#5F7360; --osaka:#96604F;
  --mincho:"Zen Old Mincho",Georgia,"Times New Roman",serif;
  --sans:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --nav:86px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1916; --surface:#232019; --surface2:#2C2822; --line:#3A362E;
  --fg:#EEE9DF; --fg2:#AAA296; --fg3:#7D766B;
  --acc:#9BAEC4; --acc-soft:#262B33;
  --alert:#CE8562; --alert-soft:#33241C;
  --ok:#92A789;
  --tokio:#7E97B3; --tsukuba:#9D90A8; --nagoya:#BE9A72; --kioto:#8FA68B; --osaka:#C2897A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1B1916; --surface:#232019; --surface2:#2C2822; --line:#3A362E;
  --fg:#EEE9DF; --fg2:#AAA296; --fg3:#7D766B;
  --acc:#9BAEC4; --acc-soft:#262B33;
  --alert:#CE8562; --alert-soft:#33241C;
  --ok:#92A789;
  --tokio:#7E97B3; --tsukuba:#9D90A8; --nagoya:#BE9A72; --kioto:#8FA68B; --osaka:#C2897A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);margin:0;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  letter-spacing:.005em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:40;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:500}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ---------- encabezado */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.hdr{display:flex;align-items:baseline;gap:16px;padding-block:16px 13px;
  border-bottom:1px solid var(--line)}
.brand{font-family:var(--mincho);font-size:19px;font-weight:500;letter-spacing:.22em;
  display:flex;align-items:center;gap:11px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--alert);flex:0 0 auto;
  transform:translateY(-1px)}
.clocks{margin-left:auto;display:flex;gap:18px;text-align:right}
.clocks b{display:block;font-size:14.5px;font-weight:500;color:var(--fg);
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clocks b s{text-decoration:none;font-size:10px;font-weight:400;color:var(--fg3);margin-left:3px}
.clocks i{font-style:normal;font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--fg3);display:block;margin-bottom:1px}

main{padding-block:26px;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 28px)}
section[hidden]{display:none!important}
.lede{color:var(--fg2);font-size:15px;margin-bottom:26px;max-width:58ch;line-height:1.7}
h2.sec{font-family:var(--mincho);font-size:12px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--fg3);font-weight:500;margin:38px 0 16px;display:flex;align-items:center;gap:14px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- barra inferior */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;justify-content:center;pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:center;gap:2px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--line);border-radius:30px;padding:7px 9px;
  box-shadow:0 2px 6px rgba(43,40,36,.06),0 14px 34px rgba(43,40,36,.10);
  max-width:520px;width:100%;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 12px;border-radius:21px;color:var(--fg3);min-width:58px;
  transition:color .18s,background .18s}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:500;letter-spacing:.03em}
.tab[aria-current="true"]{background:var(--surface2);color:var(--fg)}
.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tab.mid{color:var(--surface);background:var(--acc);border-radius:19px;
  padding:9px 14px;min-width:0;box-shadow:0 3px 10px color-mix(in srgb,var(--acc) 34%,transparent)}
.tab.mid span{color:var(--surface);opacity:.9}
.tab.mid[aria-current="true"]{background:var(--alert);
  box-shadow:0 3px 12px color-mix(in srgb,var(--alert) 40%,transparent)}
.tab.mid svg{stroke-width:1.7}

/* ---------- hoja de "Más" */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:color-mix(in srgb,var(--fg) 34%,transparent);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#sheet[hidden]{display:none!important}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:none;
  border-radius:24px 24px 0 0;width:100%;max-width:520px;
  padding:10px max(20px,env(safe-area-inset-left,0px))
          calc(env(safe-area-inset-bottom,0px) + var(--nav) + 10px);
  box-shadow:0 -10px 40px rgba(43,40,36,.16)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet button{display:flex;align-items:center;gap:15px;width:100%;padding:15px 4px;
  border-top:1px solid var(--line);font-size:16px;font-weight:500;text-align:left}
.sheet button:first-of-type{border-top:none}
.sheet button svg{width:20px;height:20px;stroke:var(--fg3);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.sheet button em{font-style:normal;margin-left:auto;font-size:13px;color:var(--fg3);font-weight:400}

/* ---------- tarjetas y piezas */
.hero{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:8px}
.hero .k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg3);
  font-weight:500}
.hero .big{font-family:var(--mincho);font-size:clamp(40px,12vw,62px);font-weight:400;
  letter-spacing:-.01em;line-height:1.12;margin:12px 0 10px}
.hero .sub{color:var(--fg2);font-size:15px;max-width:52ch;line-height:1.7}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:1px;
  background:var(--line);border-block:1px solid var(--line)}
.tile{background:var(--bg);padding:18px 2px 20px}
.grid2 .tile{padding-inline:18px}
.tile .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3);font-weight:500}
.tile .v{font-weight:500;font-size:16.5px;margin-top:6px;line-height:1.4}
.tile .n{color:var(--fg2);font-size:13.5px;margin-top:6px;line-height:1.6}
.tile.urge .v{color:var(--alert)}
.tile .cd{font-size:12.5px;color:var(--alert);font-weight:500;margin-top:8px;
  font-variant-numeric:tabular-nums}

/* ---------- días */
.days{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:6px}
.days::-webkit-scrollbar{display:none}
.dbtn{flex:0 0 auto;width:62px;padding:10px 0 9px;border-radius:12px;background:transparent;
  border:1px solid var(--line);text-align:center;transition:background .18s,border-color .18s}
.dbtn .n{display:block;font-family:var(--mincho);font-size:20px;font-weight:400;line-height:1}
.dbtn .d{display:block;font-size:10px;color:var(--fg3);margin-top:4px;letter-spacing:.06em}
.dbtn[aria-current="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.dbtn[aria-current="true"] .d{color:color-mix(in srgb,var(--surface) 78%,transparent)}
.dhead{padding:26px 0 24px;border-bottom:1px solid var(--line);margin-bottom:26px}
.dhead .t{font-family:var(--mincho);font-size:clamp(25px,6.5vw,33px);font-weight:400;
  letter-spacing:-.01em;line-height:1.25}
.dhead .z{color:var(--c);font-weight:500;font-size:13px;margin-top:7px;letter-spacing:.07em}
.dhead .r{color:var(--fg2);font-size:14.5px;margin-top:12px;max-width:56ch;line-height:1.7}

/* ---------- riel */
.rail{position:relative;padding-left:84px}
.rail::before{content:"";position:absolute;left:68px;top:14px;bottom:30px;width:1px;
  background:var(--line)}
.stop{position:relative;margin-bottom:30px}
.stop .time{position:absolute;left:-84px;top:1px;width:54px;text-align:right;
  font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.4}
.stop .time em{display:block;font-style:normal;font-size:11px;color:var(--fg3);font-weight:400}
.stop .dot{position:absolute;left:-21px;top:7px;width:7px;height:7px;border-radius:50%;
  background:var(--bg);border:1px solid var(--c);z-index:1}
.stop.key .dot{background:var(--c);width:9px;height:9px;left:-22px;top:6px}
.card{padding:0}
.card .t{font-weight:500;font-size:17px;letter-spacing:-.005em;line-height:1.4}
.stop.key .card .t{font-family:var(--mincho);font-size:19px;font-weight:500}
.card .x{color:var(--fg2);font-size:14.5px;margin-top:8px;max-width:58ch;line-height:1.72}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.b{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--fg3)}
.b.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.b.warn{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 45%,transparent)}
.b.acc{background:var(--alert);border-color:var(--alert);color:var(--surface)}
.meta{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:13.5px;
  color:var(--fg2);max-width:58ch;line-height:1.65}
.meta div{margin-bottom:5px}
.meta b{color:var(--fg);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.go{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:99px;
  font-size:13.5px;font-weight:500;text-decoration:none;border:1px solid var(--line);
  color:var(--fg);transition:background .18s,border-color .18s}
.go:hover{background:var(--surface2)}
.go.p{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.go.p:hover{filter:brightness(1.1)}
.go svg{width:14px;height:14px;flex:0 0 auto}
.go:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- listas */
.items{display:flex;flex-direction:column}
.item{padding:19px 0;border-top:1px solid var(--line)}
.items .item:first-child{border-top:none;padding-top:4px}
.item .t{font-weight:500;font-size:16.5px;line-height:1.4}
.item .x{color:var(--fg2);font-size:14.5px;margin-top:7px;max-width:62ch;line-height:1.72}
.item ul{margin:10px 0 0;padding-left:19px;color:var(--fg2);font-size:14px;line-height:1.7}
.item li{margin-bottom:7px}
.item.rec{border-left:2px solid var(--ok);padding-left:16px}
.item.no{opacity:.62}
.glos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 34px}
.gl{padding:15px 0;border-top:1px solid var(--line)}
.gl b{display:block;font-family:var(--mincho);font-size:16px;font-weight:500;margin-bottom:4px}
.gl span{color:var(--fg2);font-size:13.5px;line-height:1.68}
.fr{display:flex;flex-direction:column}
.frase{padding:15px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;
  gap:3px 14px;align-items:baseline}
.frase:first-child{border-top:none}
.frase b{font-size:16px;font-weight:500}
.frase .p{font-size:12.5px;color:var(--acc);letter-spacing:.02em}
.frase .e{color:var(--fg2);font-size:14px;width:100%}
.fl{display:flex;flex-direction:column}
.fl .f{padding:24px 0;border-top:1px solid var(--line)}
.fl .f:first-child{border-top:none;padding-top:4px}
.fl .code{font-size:11.5px;font-weight:500;color:var(--acc);letter-spacing:.14em}
.fl .route{font-family:var(--mincho);font-size:19px;font-weight:500;margin-top:5px;line-height:1.35}
.fl .times{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
  margin:16px 0;padding:15px 0;border-block:1px solid var(--line)}
.fl .times .w{font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums}
.fl .times .w em{display:block;font-style:normal;font-size:10.5px;color:var(--fg3);
  font-weight:400;margin-top:3px;letter-spacing:.1em;text-transform:uppercase}
.fl .times .mid{font-size:10px;color:var(--fg3);text-align:center;letter-spacing:.1em}
.fl .times .r{text-align:right}

/* ---------- avisos */
.alert,.ok,.info{padding:19px 20px;margin-bottom:22px;border-radius:var(--r);font-size:14.5px;
  line-height:1.7;page-break-inside:avoid}
.alert{background:var(--alert-soft)} .alert b{color:var(--alert)}
.ok{background:var(--surface2)} .ok b{color:var(--ok)}
.info{background:var(--surface2)} .info b{color:var(--acc)}

/* ---------- japonés */
.jpwrap{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--fg) 58%,transparent);
  display:flex;align-items:center;justify-content:center;padding:22px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.jpcard{background:#FCFBF8;color:#24211D;border-radius:20px;width:100%;max-width:560px;
  padding:38px 28px 30px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.34)}
.jpcard .lab{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#9C9488;font-weight:500}
.jpcard .kanji{font-family:var(--mincho);font-size:clamp(36px,10.5vw,58px);font-weight:500;
  line-height:1.3;margin:18px 0 8px;word-break:keep-all}
.jpcard .romaji{font-size:15.5px;color:#6B6357;font-weight:500}
.jpcard .addr{margin-top:24px;padding-top:21px;border-top:1px solid #E2DBCE;
  font-size:clamp(17px,4.6vw,21px);font-weight:400;line-height:1.6}
.jpcard .tip{margin-top:22px;font-size:12.5px;color:#9C9488}
.jpclose{margin-top:24px;border:1px solid #D8D0C2;border-radius:99px;padding:11px 28px;
  font-size:14px;font-weight:500;color:#24211D}

/* ---------- conversor */
.conv{border-block:1px solid var(--line);padding:24px 0;margin-bottom:10px}
.cfield{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.cfield label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3);
  font-weight:500;width:54px;flex:0 0 auto}
.cfield input{flex:1;min-width:0;background:transparent;border:none;
  border-bottom:1px solid var(--line);border-radius:0;padding:6px 2px;
  font-family:var(--mincho);font-size:30px;font-weight:400;color:var(--fg);
  font-variant-numeric:tabular-nums;width:100%}
.cfield input:focus{outline:none;border-bottom-color:var(--acc)}
.cswap{text-align:center;color:var(--fg3);font-size:13px;margin:2px 0 12px}
.rate{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--fg2);
  padding-top:17px;margin-top:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.rate input{width:66px;background:transparent;border:none;border-bottom:1px solid var(--line);
  padding:4px 2px;font-size:15px;color:var(--fg);font-weight:500;text-align:center}
.rate input:focus{outline:none;border-bottom-color:var(--acc)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.q{background:var(--bg);padding:14px 13px}
.q b{display:block;font-family:var(--mincho);font-size:18px;font-weight:400}
.q span{display:block;font-size:13.5px;color:var(--acc);font-weight:500;margin-top:3px}

/* ---------- checklist */
.ck{border-bottom:1px solid var(--line);padding:0 0 18px;margin-bottom:26px}
.ck h3{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg3);
  font-weight:500;margin-bottom:6px}
.ck label{display:flex;align-items:flex-start;gap:13px;padding:10px 0;cursor:pointer;
  font-size:14.5px;line-height:1.55;border-top:1px solid var(--line)}
.ck label:first-of-type{border-top:none}
.ck input{appearance:none;-webkit-appearance:none;width:19px;height:19px;flex:0 0 auto;
  border:1px solid var(--fg3);border-radius:50%;margin-top:2px;background:transparent;
  position:relative;cursor:pointer;transition:background .18s,border-color .18s}
.ck input:checked{background:var(--ok);border-color:var(--ok)}
.ck input:checked::after{content:"";position:absolute;left:5.5px;top:2.5px;width:5px;height:9px;
  border:solid #FBFAF7;border-width:0 1.8px 1.8px 0;transform:rotate(43deg)}
.ck input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ck input:checked + span{color:var(--fg3);text-decoration:line-through}
.ck .imp{color:var(--alert)}

/* ---------- ayuda */
.sos{border:1px solid var(--alert);background:var(--alert-soft);border-radius:var(--r);
  padding:22px;margin-bottom:26px}
.sos .k{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--alert);font-weight:500}
.sos .t{font-family:var(--mincho);font-size:21px;font-weight:500;margin:7px 0 14px;line-height:1.35}
.sos .acts{margin:0}
.sos .go{border-color:color-mix(in srgb,var(--alert) 40%,transparent);background:var(--surface)}
.tel{margin-top:7px}
.tel a,.tel span{display:inline-block;font-family:var(--mincho);font-size:30px;font-weight:400;
  color:var(--alert);user-select:all;letter-spacing:.01em;text-decoration:none;line-height:1.2}
.tel a{border-bottom:1px solid color-mix(in srgb,var(--alert) 35%,transparent)}
.prob{border-top:1px solid var(--line);overflow:hidden}
.prob>summary{padding:17px 0;font-weight:500;font-size:16px;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:12px}
.prob>summary::-webkit-details-marker{display:none}
.prob>summary::after{content:"";margin-left:auto;flex:0 0 auto;width:8px;height:8px;
  border-right:1.4px solid var(--fg3);border-bottom:1.4px solid var(--fg3);
  transform:rotate(45deg) translateY(-2px);transition:transform .22s}
.prob[open]>summary::after{transform:rotate(-135deg) translateY(1px)}
.prob .cuerpo{padding:0 0 19px}
.prob ol{margin:0;padding-left:20px;font-size:14.5px;color:var(--fg2);line-height:1.72}
.prob ol li{margin-bottom:9px}
.prob ol li::marker{color:var(--acc)}

footer{border-top:1px solid var(--line);margin-top:46px;padding-block:22px 6px;
  color:var(--fg3);font-size:12.5px;line-height:1.7}

@media(max-width:400px){
